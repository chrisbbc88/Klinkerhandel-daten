<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Klinkerhandel Produktstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</body>
</html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: helle Arbeitsfläche, schmale weiße Kopfleiste mit rotem Markenstrich. Oben „Datenblatt einlesen“, darunter Schritte | Formular | Vorschau + Checkliste. Nur heller Modus (bewusst). */
:root{
  color-scheme:light;
  --ink:#0b1519;            /* Markenschwarz klinkerhandel.de */
  --signal:#c8161d;         /* Markenrot */
  --signal-soft:#fcefef;
  --clay:#a8452f;
  --bg:#f5f6f7;
  --surface:#ffffff;
  --surface-2:#f9fafb;
  --line:#e3e6e9;
  --line-strong:#cfd4d8;
  --text:#212934;
  --muted:#636b75;
  --faint:#8b929a;
  --ok:#1d7148;--ok-soft:#e8f4ee;
  --warn:#8f5c00;--warn-soft:#fdf4e3;--warn-dot:#d39a2c;
  --bad:#b0161b;--bad-soft:#fcecec;
  --ai:#2f5d8a;--ai-soft:#eaf1f8;--ai-line:#c6d7e8;
  --serp-link:#1a0dab;--serp-text:#4d5156;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--font-body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--signal)}
.top-in{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:10px 0;max-width:1440px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding-bottom:10px}
.brand-mark{width:26px;height:18px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.5px}
.brand-mark i{background:var(--signal)}
.brand-mark i:nth-child(1){grid-column:1/3}.brand-mark i:nth-child(2){grid-column:3/5}
.brand-mark i:nth-child(3){grid-column:1/2}.brand-mark i:nth-child(4){grid-column:2/4}.brand-mark i:nth-child(5){grid-column:4/5}
.brand-mark i:nth-child(6){grid-column:1/3;opacity:.45}.brand-mark i:nth-child(7){grid-column:3/5;opacity:.45}
.brand-txt b{display:block;font-weight:600;font-size:14px;letter-spacing:.01em;line-height:1.15}
.brand-txt span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;align-self:flex-end}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px 10px;cursor:pointer;font-size:13px;font-weight:500;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab .cnt{font-family:var(--font-mono);font-size:10.5px;background:var(--bg);border:1px solid var(--line);padding:0 6px;border-radius:999px;color:var(--muted)}

main{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;color:var(--ink)}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
.lead{color:var(--muted);max-width:68ch;margin:4px 0 0}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}

.intake{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);margin-bottom:18px;overflow:hidden}
@media (max-width:820px){.intake{grid-template-columns:minmax(0,1fr)}}
.intake-drop{padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
@media (max-width:820px){.intake-drop{border-right:0;border-bottom:1px solid var(--line)}}
.dz{border:1px dashed var(--line-strong);border-radius:6px;padding:16px;text-align:center;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;transition:border-color .15s,background .15s}
.dz:hover{border-color:var(--ai)}
.dz.over{border-color:var(--ai);background:var(--ai-soft)}
.dz svg{width:22px;height:22px;color:var(--ai)}
.dz b{font-weight:600;font-size:13px}
.intake-body{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ai-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ai);background:var(--ai-soft);border:1px solid var(--ai-line);padding:2px 7px;border-radius:999px}
.ai-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.ai-steps{grid-template-columns:minmax(0,1fr)}}
.ai-steps li{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.ai-steps li b{display:block;color:var(--text);font-size:12.5px;font-weight:600;margin-bottom:2px}
.progress{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pages img{width:52px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.spin{width:16px;height:16px;border:2px solid var(--ai-line);border-top-color:var(--ai);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.review-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.review{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
.review th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.review td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.review tr:last-child td{border-bottom:0}
.review td:first-child{width:28px}
.review td:nth-child(2){color:var(--muted);width:160px}
.review input{width:15px;height:15px;accent-color:var(--ai);margin:2px 0 0}
.review .old{color:var(--faint);text-decoration:line-through;margin-right:6px}
.notes{margin:0;padding-left:18px;color:var(--warn);font-size:12.5px}

.studio{display:grid;grid-template-columns:190px minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:1180px){.studio{grid-template-columns:minmax(0,1fr) 300px}.steps{grid-column:1/-1}}
@media (max-width:860px){.studio{grid-template-columns:minmax(0,1fr)}}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px}
@media (max-width:1180px){.steps{position:static;flex-direction:row;overflow-x:auto;border-bottom:1px solid var(--line)}}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:0 6px 6px 0;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);white-space:nowrap;border-left:2px solid transparent}
@media (max-width:1180px){.step{border-left:0;border-bottom:2px solid transparent;border-radius:0}}
.step:hover{color:var(--text)}
.step[aria-current="step"]{color:var(--ink);border-left-color:var(--signal);background:var(--surface)}
@media (max-width:1180px){.step[aria-current="step"]{border-bottom-color:var(--signal);background:none}}
.step .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line-strong);flex:none;background:var(--surface)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step[aria-current="step"] .dot{border-color:var(--signal);color:var(--signal)}
.step b{display:block;font-weight:500;font-size:13px}
.step small{font-size:11px;color:var(--faint)}

.form{padding:22px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:600px){.form{padding:16px}}
.form-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag.example{background:var(--warn-soft);color:var(--warn)}
.ki{display:inline-flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ai);background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:999px;padding:0 6px;line-height:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:500;font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--text)}
.req{color:var(--signal)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;min-height:36px;font-size:13px}
textarea{min-height:120px;resize:vertical;line-height:1.55}
input:hover,select:hover,textarea:hover{border-color:#aeb5bb}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(11,21,25,.08)}
input.invalid{border-color:var(--bad);background:var(--bad-soft)}
input.valid{border-color:var(--ok)}
.from-ai{border-color:var(--ai-line)!important;background:var(--ai-soft)!important}
.msg{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}.msg.muted{color:var(--muted)}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.choice{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .15s}
.choice:hover{border-color:#9ea6ac}
.choice[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);background:var(--signal-soft)}
.choice b{font-size:13px;font-weight:600}
.choice small{color:var(--muted);font-size:11.5px;line-height:1.35}
.choice svg{width:72px;height:22px;margin-bottom:3px}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.sw{border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px;text-align:left}
.sw .chip{width:22px;height:16px;border-radius:2px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw:hover{border-color:var(--line-strong)}
.sw[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);font-weight:600}
.sw .ord{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--signal)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.pill:hover{border-color:#9ea6ac}
.pill[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);background:var(--signal-soft)}
.pill small{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.pill.static{cursor:default}

.calc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface-2)}
@media (max-width:600px){.calc{grid-template-columns:minmax(0,1fr)}}
.wall{width:180px;height:110px;border-radius:4px;max-width:100%}
.calc-num{font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.calc-num small{font-size:12px;font-weight:400;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--signal)}

.drop{border:1px dashed var(--line-strong);border-radius:8px;padding:18px;text-align:center;background:var(--surface-2);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--signal);background:var(--signal-soft)}
.drop b{display:block;font-size:13px;font-weight:600}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.img{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.img .ph{aspect-ratio:4/3;background:var(--surface-2) center/cover no-repeat;position:relative;max-width:100%}
.img .ph .no{position:absolute;top:6px;left:6px;background:var(--surface);color:var(--ink);font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:3px}
.img .ph .lowres{position:absolute;bottom:6px;left:6px;right:6px;background:var(--warn-soft);color:var(--warn);font-size:11px;padding:2px 6px;border-radius:3px}
.img .meta{padding:9px;display:flex;flex-direction:column;gap:6px}
.img select{min-height:32px;padding:4px 8px;font-size:12.5px}
.img .fn{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);word-break:break-all}
.img .acts{display:flex;gap:5px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;min-width:30px;height:28px;cursor:pointer;font-size:12px;padding:0 8px;color:var(--muted)}
.icon-btn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.icon-btn:disabled{opacity:.4}

.serp{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:2px;font-family:Arial,sans-serif}
.serp .u{font-size:12px;color:var(--serp-text)}
.serp .t{color:var(--serp-link);font-size:18px;line-height:1.3}
.serp .d{font-size:13px;color:var(--serp-text)}
.meter{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.over i{background:var(--bad)}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--signal);margin-top:2px;flex:none}
.toggle b{font-weight:600}

.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:500;font-size:13px;min-height:36px;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#22323a}
.btn.red{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--signal);font-weight:500;cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){.side{position:static}}
.preview{overflow:hidden}
.pv-img{aspect-ratio:4/3;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;color:var(--faint);font-size:12px;max-width:100%;border-bottom:1px solid var(--line)}
.pv-body{padding:14px;display:flex;flex-direction:column;gap:6px}
.pv-title{font-weight:600;font-size:14px;line-height:1.35;color:var(--ink)}
.pv-dots{display:flex;gap:4px;flex-wrap:wrap}
.pv-dots i{width:12px;height:12px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pv-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;border-top:1px solid var(--line);padding-top:6px}
.pv-row span:first-child{color:var(--muted)}
.pv-link{font-size:12px;color:var(--signal);font-weight:500}
.check{padding:14px;display:flex;flex-direction:column;gap:10px}
.check-head{display:flex;align-items:center;gap:12px}
.ring{width:48px;height:48px;flex:none}
.ring text{font-family:var(--font-mono);font-size:12px;font-weight:500;fill:var(--text)}
.check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.check li button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;padding:5px 4px;border-radius:4px;cursor:pointer;text-align:left;font-size:12.5px}
.check li button:hover{background:var(--surface-2)}
.lamp{width:7px;height:7px;border-radius:50%;flex:none}
.lamp.ok{background:var(--ok)}.lamp.bad{background:var(--bad)}.lamp.warn{background:var(--warn-dot)}
.check li .t2{margin-left:auto;font-size:10.5px;color:var(--faint)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{max-width:260px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;min-width:900px;font-size:12.5px}
.data th,.data td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.data th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;background:var(--surface-2)}
.data tr:last-child td{border-bottom:0}
.data tbody tr:hover{background:var(--surface-2)}
.data tbody tr.sel{background:var(--signal-soft)}
.data input[type=checkbox]{width:15px;height:15px;accent-color:var(--signal)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge.new{background:var(--ok-soft);color:var(--ok)}
.badge.upd{background:var(--warn-soft);color:var(--warn)}
.badge.old{color:var(--muted);border-color:var(--line)}
.badge.miss{background:var(--bad-soft);color:var(--bad)}
.changed{box-shadow:inset 0 -2px 0 var(--warn-dot)}
.bar{width:70px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
.bulk{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--surface);border:1px solid var(--line-strong);border-left:3px solid var(--signal);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(11,21,25,.12)}
.bulk b{font-size:13px;font-weight:600;margin-right:4px}
.bulk select{width:auto;max-width:100%}

.exp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.exp{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{padding:10px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.code{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:16px;font-family:var(--font-mono);font-size:11.5px;line-height:1.65;overflow:auto;max-height:640px;white-space:pre;margin:0}
.code .k{color:#8a2a2e}.code .s{color:var(--ok)}.code .n{color:var(--warn)}.code .b{color:var(--ai)}
.flow{display:flex;flex-direction:column;gap:8px;font-size:12.5px;margin:0;padding:0;list-style:none;counter-reset:f}
.flow li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.flow li::before{counter-increment:f;content:counter(f);width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#erfassen" aria-label="Klinkerhandel Produktstation">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>

    <nav class="tabs" aria-label="Bereiche">

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Stammdaten (aus dem Live-Shop abgeleitet) ---------- */
const TYPEN={
  verblender:{label:"Verblender",kurz:"Verblender",desc:"Vollstein für die Vormauerschale"},
  riemchen:{label:"Riemchen",kurz:"Riemchen",desc:"Klinkerscheibe für Sanierung und WDVS"},
  beides:{label:"Verblender + Riemchen",kurz:"Verblender",desc:"Legt zwei verknüpfte Produkte an"},
  daemmklinker:{label:"Dämmklinker",kurz:"Dämmklinker",desc:"Riemchen auf Dämmplatte"}
};
const HERSTELLUNG={
  handform:{label:"Handform",desc:"Unregelmäßige Kanten, lebendige Oberfläche"},
  strangpress:{label:"Strangpress",desc:"Exakte Maße, klare Kanten"},
  wasserstrich:{label:"Wasserstrich",desc:"Weiche Kanten, typische Schlieren"}
};
const HERSTELLER=["ABC Klinker","Deppe Klinker","Engels Baksteen","Feldhaus Klinker","Hagemann Nistklinker","Hagemeister","Iking Klinker","MBI Beton Klinker","Nelissen Klinker","Vandersanden","Wienerberger"];
const FARBEN={
  rot:"#a8402e",rotbunt:"linear-gradient(90deg,#8f3424,#c4693c 50%,#7a2f22)",braun:"#6e4632",bordeaux:"#6b2230",orange:"#c4692f",
  gelb:"#d4b05a",beige:"#cbb08c",creme:"#e4d9bf","weiß":"#ecebe6",grau:"#8d8e8a",blau:"#4b5866",schwarz:"#2a2826",
  violett:"#5b4256",rose:"#c98f86",nuanciert:"conic-gradient(#a8402e,#cbb08c,#8d8e8a,#6e4632,#a8402e)"
};
const FORMATE=[
  {k:"WF",n:"Waalformat",m:[210,100,50]},{k:"WDF",n:"Waaldickformat",m:[210,100,65]},
  {k:"NF",n:"Normalformat",m:[240,115,71]},{k:"DF",n:"Dünnformat",m:[240,115,52]},
  {k:"2DF",n:"Doppeltes Dünnformat",m:[240,115,113]},{k:"RF",n:"Reichsformat",m:[250,120,65]},
  {k:"LDF",n:"Langes Dünnformat",m:null},{k:"XLDF",n:"Extra langes DF",m:null},{k:"ModF",n:"Modulformat",m:null},
  {k:"LF",n:"Langformat",m:null},{k:"BDF",n:"Bundesdünnformat",m:null},{k:"Modul",n:"Modul",m:null}
];
const OBERFL=["glatt","besandet","genarbt","gerumpelt","geschnitten","geflammt"];
const FROST={"":"– bitte wählen –","F2":"F2 – voll frostbeständig","F1":"F1 – mäßig","F0":"F0 – nur geschützt"};
const ROLLEN={freisteller:"Freisteller (Einzelstein)",wand:"Wandfläche",detail:"Detail / Nahaufnahme",referenz:"Objektfoto"};
const STEPS=[{t:"Stein",s:"Typ, Nummer, Hersteller"},{t:"Optik",s:"Farbe, Format, Oberfläche"},{t:"Technik",s:"Maße, Werte, Bedarf"},{t:"Bilder",s:"Upload, Reihenfolge"},{t:"Prüfen",s:"Texte, SEO, Übernahme"}];
const FIELD_LABEL={bezeichnung:"Bezeichnung",artikel_hersteller:"Artikelnr. Hersteller",hersteller:"Hersteller",typ:"Produkttyp",herstellung:"Herstellungsart",
  farben:"Farben",formate:"Formate",oberflaeche:"Oberfläche","technik.l":"Länge (mm)","technik.b":"Breite (mm)","technik.h":"Höhe (mm)",
  "technik.gewicht":"Gewicht (kg/Stk.)","technik.druck":"Druckfestigkeit (N/mm²)","technik.wasser":"Wasseraufnahme (%)","technik.frost":"Frostwiderstand",
  "technik.bedarf":"Bedarf (Stk./m²)","technik.staerke":"Riemchenstärke (mm)",herstellertext:"Herstellertext"};

/* ---------- Beispielbilder (Canvas) ---------- */
function brickImage(base,mode){
  const c=document.createElement("canvas");c.width=800;c.height=600;const x=c.getContext("2d");
  let seed=base.length*7+mode.length;const rnd=()=>{seed=Math.sin(seed)*10000;return seed-Math.floor(seed)};
  const tone=(hex,v)=>{const n=parseInt(hex.slice(1),16);const cl=q=>Math.max(0,Math.min(255,q|0));return `rgb(${cl((n>>16)+v)},${cl(((n>>8)&255)+v)},${cl((n&255)+v)})`};
  const pal=base.split(",");
  if(mode==="freisteller"){
    x.fillStyle="#f4f4f2";x.fillRect(0,0,800,600);
    x.fillStyle="rgba(0,0,0,.10)";x.beginPath();x.ellipse(400,420,250,24,0,0,7);x.fill();
    x.fillStyle=pal[0];x.fillRect(150,250,500,160);
    for(let i=0;i<1400;i++){x.fillStyle=tone(pal[i%pal.length],(rnd()-.5)*60);x.globalAlpha=.35;x.fillRect(150+rnd()*500,250+rnd()*160,3+rnd()*6,2+rnd()*4)}
    x.globalAlpha=1;return c.toDataURL("image/jpeg",.82);
  }
  const bh=mode==="detail"?70:34,bw=mode==="detail"?300:150,j=mode==="detail"?14:7;
  x.fillStyle="#bdb8ae";x.fillRect(0,0,800,600);
  for(let row=0,y=0;y<600;row++,y+=bh+j){const off=row%2?-(bw+j)/2:0;
    for(let xx=off;xx<800;xx+=bw+j){x.fillStyle=tone(pal[Math.floor(rnd()*pal.length)],(rnd()-.5)*40);x.fillRect(xx,y,bw,bh);
      for(let k=0;k<20;k++){x.fillStyle=`rgba(0,0,0,${rnd()*.12})`;x.fillRect(xx+rnd()*bw,y+rnd()*bh,2+rnd()*8,1+rnd()*3)}}}
  return c.toDataURL("image/jpeg",.82);
}

/* ---------- Zustand ---------- */
let uid=1;
function emptyDraft(){return {id:"d"+(uid++),beispiel:false,typ:"",sku:"",bezeichnung:"",artikel_hersteller:"",hersteller:"",herstellung:"",farben:[],formate:[],oberflaeche:[],
  technik:{l:"",b:"",h:"",gewicht:"",druck:"",wasser:"",frost:"",staerke:"",ecken:false,fuge:10,bedarf:""},
  bilder:[],herstellertext:"",claudeText:true,editSku:null,keep:null,ki:new Set(),datenblatt:null};}
function exampleDraft(){
  const d=emptyDraft();Object.assign(d,{beispiel:true,typ:"beides",sku:"HBR 12-201",bezeichnung:"Beispielstein „Rhede Kohlebrand“",hersteller:"Engels Baksteen",
    herstellung:"handform",farben:["rotbunt","braun"],formate:["WDF"],oberflaeche:["besandet"],
    herstellertext:"Beispieltext: Handgeformter Verblender aus niederländischem Flussklei, im Ringofen gebrannt. Die besandete Oberfläche und die leicht unregelmäßigen Kanten ergeben ein warmes, lebendiges Fassadenbild in Rot- und Brauntönen. Geeignet für Neubau und Ergänzung im Bestand."});
  Object.assign(d.technik,{l:"210",b:"100",h:"65",gewicht:"2,1",frost:"F2",staerke:"20",ecken:true,fuge:10});
  const pal="#8f3424,#b0522f,#6e4632,#9c3d2a";
  d.bilder=[["freisteller","freisteller"],["wand","wand"],["detail","detail"]].map(([r,m],i)=>({id:"i"+i,src:brickImage(pal,m),rolle:r,w:800,h:600,orig:"beispiel-"+(i+1)+".jpg"}));
  return d;
}
function product(sku,typ,herst,herstellung,farben,formate,extra={}){
  return Object.assign({sku,typ,hersteller:herst,herstellung,farben,formate,bilderAnzahl:0,hatFreisteller:false,technik:{},herstellertext:"",quelle:"bestand",aktion:"keine",geaendert:[]},extra);
}
const state={view:"erfassen",step:0,draft:exampleDraft(),
  products:[
    product("HBR 11-105","verblender","Vandersanden","handform",["nuanciert","weiß","grau"],["WDF","WF"],{bilderAnzahl:7,hatFreisteller:true}),
    product("HBR 11-105 R","riemchen","Vandersanden","handform",["nuanciert","weiß","grau"],["WDF","WF"],{bilderAnzahl:7,hatFreisteller:true}),
    product("HBR 11-112","verblender","","handform",[],[],{bilderAnzahl:7}),
    product("HBR 11-119","verblender","","handform",[],[],{bilderAnzahl:7}),
    product("HBR 10-105","verblender","","handform",[],[],{bilderAnzahl:5}),
    product("HBR 11-114","verblender","","handform",[],[],{bilderAnzahl:6}),
    product("HBR 11-116","verblender","","handform",[],[],{bilderAnzahl:8})],
  sel:new Set(),filter:"alle",q:""};
const intake={status:"idle",file:"",pages:[],result:null,accept:{},msg:"",ctl:null,ready:false,sampler:null,imgLimits:null,demo:false};

/* ---------- Hilfen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const num=v=>parseFloat(String(v).replace(",","."));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2600)}
const SKU_RE=/^[A-Z]{2,4} \d{2}-\d{3}$/;
function skuState(d){
  const s=d.sku.trim();
  if(!s) return {ok:false,msg:"Artikelnummer fehlt",cls:"bad"};
  if(!SKU_RE.test(s)) return {ok:false,msg:"Format: Kürzel, Leerzeichen, 2 Ziffern, Bindestrich, 3 Ziffern (z. B. HBR 11-105)",cls:"bad"};
  const dup=state.products.find(p=>p.sku===s||p.sku===s+" R");
  if(dup&&!d.editSku) return {ok:false,msg:`${dup.sku} gibt es schon im Shop.`,cls:"bad",dup:dup.sku};
  return {ok:true,msg:d.editSku?"Bestehendes Produkt wird aktualisiert":"Nummer ist frei",cls:"ok"};
}
function skus(d){const s=d.sku.trim();return d.typ==="beides"?[s,s+" R"]:d.typ==="riemchen"?[s+" R"]:[s];}
function bedarf(d){const l=num(d.technik.l),h=num(d.technik.h),f=num(d.technik.fuge)||10;return l&&h?1e6/((l+f)*(h+f)):null;}
function checks(d){
  const t=d.technik,frei=d.bilder.some(b=>b.rolle==="freisteller")||!!d.keep?.frei,nB=d.bilder.length+(d.keep?.anzahl||0);
  return [
    {l:"Produkttyp gewählt",ok:!!d.typ,req:true,step:0},
    {l:"Artikelnummer gültig und frei",ok:skuState(d).ok,req:true,step:0},
    {l:"Hersteller",ok:!!d.hersteller,req:true,step:0},
    {l:"Herstellungsart",ok:!!d.herstellung,req:true,step:0},
    {l:"Mindestens eine Farbe",ok:d.farben.length>0,req:true,step:1},
    {l:"Mindestens ein Format",ok:d.formate.length>0,req:true,step:1},
    {l:"Maße L × B × H",ok:!!(num(t.l)&&num(t.b)&&num(t.h)),req:true,step:2},
    {l:"Frostwiderstand",ok:!!t.frost,req:false,step:2},
    {l:"Druckfestigkeit und Wasseraufnahme",ok:!!(t.druck&&t.wasser),req:false,step:2},
    {l:"Freisteller-Bild",ok:frei,req:true,step:3},
    {l:"Mindestens 3 Bilder",ok:nB>=3,req:false,step:3},
    {l:"Herstellertext ab 150 Zeichen",ok:d.herstellertext.trim().length>=150,req:false,step:4}];
}
function score(d){const c=checks(d);const w=c.reduce((a,x)=>a+(x.req?2:1),0);return Math.round(c.reduce((a,x)=>a+(x.ok?(x.req?2:1):0),0)/w*100);}
function stepDone(d,i){const c=checks(d);return i===4?c.filter(x=>x.req).every(x=>x.ok):c.filter(x=>x.step===i&&x.req).every(x=>x.ok);}
function typKurz(d){return d.typ==="riemchen"?"Riemchen":d.typ==="daemmklinker"?"Dämmklinker":"Verblender";}
function produktName(d,riem){
  const art=HERSTELLUNG[d.herstellung]?.label||"…",sku=d.sku.trim()||"…";
  if(d.typ==="daemmklinker") return `Dämmklinker – ${sku} – ${art}`;
  return riem?`Riemchen / Verblender – ${sku} R – ${art} Klinkerriemchen`:`Klinker / Verblender – ${sku} – ${art} Klinkerstein`;
}
function seoTitel(d){const art=HERSTELLUNG[d.herstellung]?.label||"",f=d.farben.slice(0,2).join(" & ");
  return `${art?art+"-":""}${typKurz(d)} ${d.sku.trim()||"…"}${f?" in "+f:""} | Klinkerhandel Rhede`;}
function metaText(d){const art=HERSTELLUNG[d.herstellung]?.label||"";
  return `${typKurz(d)} ${d.sku.trim()} ${d.hersteller?"von "+d.hersteller:""}: ${art}${d.farben.length?", "+d.farben.join(", "):""}${d.formate.length?", Format "+d.formate.join("/"):""}. Muster ansehen und beraten lassen in unserer Ausstellung in Rhede.`.replace(/\s+/g," ");}
function dateiname(d,i){return `${slug(d.sku||"neu")}-${slug(typKurz(d))}-${slug(d.herstellung||"klinker")}-${String(i+1).padStart(2,"0")}.webp`;}
function altText(d,b){return `${typKurz(d)} ${d.sku.trim()} ${HERSTELLUNG[d.herstellung]?.label||""}${d.farben.length?" in "+d.farben.join(", "):""} – ${ROLLEN[b.rolle]||""}`.replace(/\s+/g," ").trim();}
const kiTag=k=>state.draft.ki.has(k)?' <span class="ki" title="Aus dem Datenblatt übernommen">Datenblatt</span>':"";
const kiCls=k=>state.draft.ki.has(k)?"from-ai":"";

/* ---------- Ansichten ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.view===state.view?"page":"false"));
  $("#cntSort").textContent=state.products.length;
  $("#cntExp").textContent=state.products.filter(p=>p.aktion!=="keine").length;
  const app=$("#app");
  if(state.view==="erfassen"){app.innerHTML=viewErfassen();renderIntake();updateSide();bindForm();}
  if(state.view==="sortiment") app.innerHTML=viewSortiment();
  if(state.view==="export") app.innerHTML=viewExport();
}
function viewErfassen(){
  const d=state.draft;
  return `<div class="view-head"><div><div class="eyebrow">${d.editSku?"Produkt bearbeiten":"Neues Produkt"}</div>
      <h1>${d.editSku?esc(d.editSku):"Produkt erfassen"}</h1>
      <p class="lead">Datenblatt einlesen lassen oder Werte von Hand eintragen. Rechts siehst du, wie das Produkt im Shop erscheint und was noch fehlt.</p></div>
    <button class="btn" data-act="newDraft">Leeres Formular</button></div>
  <section class="panel intake" id="intake" aria-label="Datenblatt einlesen"></section>
  <div class="studio">
    <nav class="steps" aria-label="Schritte">${STEPS.map((s,i)=>{const done=stepDone(d,i)&&i!==state.step;return `<button class="step ${done?"done":""}" data-step="${i}" ${i===state.step?'aria-current="step"':""}>
      <span class="dot">${done?"✓":i+1}</span><span><b>${s.t}</b><small>${s.s}</small></span></button>`}).join("")}</nav>
    <section class="panel form" id="form">${stepBody(d)}</section>
    <aside class="side" id="side"></aside></div>`;
}

/* ---- Datenblatt-Bereich ---- */
function renderIntake(){
  const el=$("#intake");if(!el) return;
  const canAI=!!intake.sampler,canImg=!!intake.imgLimits;
  const left=`<div class="intake-drop">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Datenblatt einlesen</h2><span class="ai-chip">KI</span></div>
    <label class="dz" id="dz" for="f-sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <b>PDF oder Foto hier ablegen</b><span class="hint">oder klicken zum Auswählen</span></label>
    <input type="file" id="f-sheet" accept="application/pdf,image/jpeg,image/png,image/webp" hidden>
    <span class="hint">${!intake.ready?"Verbindung zur KI wird geprüft …":canAI?(canImg?"Liest Text und Tabellen aus PDF-Datenblättern und Fotos.":"Liest Text aus PDFs. Fotos gehen in dieser Ansicht nicht."):"Präsentationsversion: Die Datei wird geladen, das Auslesen ist simuliert. In der Live-Version liest Claude das Datenblatt aus."}</span>
  </div>`;
  let right="";
  if(intake.status==="idle"){
    right=`<ol class="ai-steps">
      <li><b>Hochladen</b>Datenblatt vom Hersteller als PDF oder Foto.</li>
      <li><b>Auslesen</b>Die KI erkennt Hersteller, Farben, Formate, Maße und technische Werte.</li>
      <li><b>Bestätigen</b>Du prüfst jeden Wert und übernimmst ihn ins Formular.</li></ol>
      <div class="msg muted">Die Artikelnummer (HBR-Code) vergibst du weiterhin selbst. Werte, die nicht im Datenblatt stehen, bleiben leer.
      ${!canAI&&intake.ready?`<button class="link-btn" data-act="demoIntake">Beispielergebnis ohne Datei ansehen</button>`:""}</div>`;
  }
  if(intake.status==="reading"||intake.status==="thinking"){
    right=`<div class="progress"><span class="spin" aria-hidden="true"></span><div><b>${intake.status==="reading"?"Datenblatt wird vorbereitet":"KI liest das Datenblatt"}</b>
      <div class="hint">${esc(intake.file)} · ${intake.status==="reading"?"Seiten werden gerendert":"dauert meist 20 bis 60 Sekunden"}</div></div>
      ${intake.status==="thinking"&&intake.sampler?`<button class="btn ghost" data-act="stopIntake" style="margin-left:auto">Abbrechen</button>`:""}</div>
      ${intake.pages.length?`<div class="pages">${intake.pages.map(p=>`<img src="${p}" alt="">`).join("")}</div>`:""}`;
  }
  if(intake.status==="error"){
    right=`<div class="msg bad"><b>Auslesen nicht möglich.</b> ${esc(intake.msg)}</div>
      <div><button class="btn" data-act="resetIntake">Anderes Datenblatt wählen</button></div>`;
  }
  if(intake.status==="review"){
    const rows=reviewRows(),n=rows.filter(r=>intake.accept[r.k]&&!r.blocked).length;
    right=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div><h3>${rows.length} Werte gefunden ${intake.demo?'<span class="tag example">Beispielergebnis</span>':""}</h3><div class="hint">${esc(intake.file)}. Abwählen, was nicht stimmt.</div></div>
        ${intake.pages.length?`<div class="pages">${intake.pages.slice(0,4).map(p=>`<img src="${p}" alt="">`).join("")}</div>`:""}</div>
      ${rows.length?`<div class="review-wrap"><table class="review"><thead><tr><th></th><th>Feld</th><th>Wert aus Datenblatt</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><input type="checkbox" data-accept="${r.k}" ${intake.accept[r.k]&&!r.blocked?"checked":""} ${r.blocked?"disabled":""} aria-label="${esc(FIELD_LABEL[r.k])} übernehmen"></td>
        <td>${esc(FIELD_LABEL[r.k]||r.k)}</td><td>${r.old?`<span class="old">${esc(r.old)}</span>`:""}${esc(r.show)}${r.note?`<div class="msg warn">${esc(r.note)}</div>`:""}</td></tr>`).join("")}
      </tbody></table></div>`:'<div class="msg warn">Im Datenblatt wurden keine verwertbaren Produktdaten gefunden.</div>'}
      ${intake.result.hinweise?.length?`<div><div class="eyebrow" style="margin-bottom:4px">Hinweise der KI</div><ul class="notes">${intake.result.hinweise.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>`:""}

function fmtVal(k,v){if(Array.isArray(v)) return v.join(", ");if(k==="typ") return TYPEN[v]?.label||v;if(k==="herstellung") return HERSTELLUNG[v]?.label||v;if(k==="technik.frost") return FROST[v]||v;
  if(k==="herstellertext") return v.length>180?v.slice(0,180)+" …":v;return String(v);}
function getPath(o,p){return p.split(".").reduce((a,k)=>a?.[k],o);}
function reviewRows(){
  const r=intake.result,rows=[],d=state.draft;
  for(const k of Object.keys(FIELD_LABEL)){
    const v=getPath(r,k);if(v==null||v===""||(Array.isArray(v)&&!v.length)) continue;
    const cur=getPath(d,k),curEmpty=cur==null||cur===""||(Array.isArray(cur)&&!cur.length);
    const row={k,v,show:fmtVal(k,v),old:!curEmpty&&k!=="herstellertext"&&fmtVal(k,cur)!==fmtVal(k,v)?fmtVal(k,cur):""};
    if(k==="hersteller"&&!HERSTELLER.includes(v)){row.blocked=true;row.note="Nicht in der Herstellerliste. Bitte im Shop als Marke anlegen.";}
    rows.push(row);
  }
  return rows;
}
function normalize(raw){
  const o={technik:{}},s=v=>v==null?null:(String(v).trim()||null);
  o.bezeichnung=s(raw.bezeichnung);o.artikel_hersteller=s(raw.artikelnummer_hersteller);
  const h=s(raw.hersteller);
  o.hersteller=h?(HERSTELLER.find(x=>x.toLowerCase()===h.toLowerCase())||HERSTELLER.find(x=>x.toLowerCase().split(" ")[0]===h.toLowerCase().split(" ")[0])||h):null;
  o.typ=TYPEN[raw.produkttyp]?raw.produkttyp:null;
  o.herstellung=HERSTELLUNG[raw.herstellung]?raw.herstellung:null;
  const arr=(v,allowed)=>Array.isArray(v)?[...new Set(v.map(x=>String(x).trim()).filter(x=>allowed.includes(x)))]:[];
  o.farben=arr(raw.farben,Object.keys(FARBEN));o.formate=arr(raw.formate,FORMATE.map(f=>f.k));o.oberflaeche=arr(raw.oberflaeche,OBERFL);
  const t=raw.technik||{};["l","b","h","gewicht","druck","wasser","bedarf","staerke"].forEach(k=>{const v=s(t[k]);o.technik[k]=v?(v.replace(/[^\d,.\-–]/g,"")||null):null;});
  o.technik.frost=["F0","F1","F2"].includes(s(t.frost))?s(t.frost):null;
  o.herstellertext=s(raw.herstellertext);
  o.hinweise=Array.isArray(raw.hinweise)?raw.hinweise.map(String).slice(0,4):[];
  return o;
}
function buildPrompt(text){
  return `Du liest ein Produktdatenblatt eines Klinkerherstellers aus (Verblender, Klinkerriemchen oder Dämmklinker). Die Daten werden in einen Onlinekatalog übernommen.

Antworte nur mit einem JSON-Objekt in genau dieser Form:
{"bezeichnung":string|null,"artikelnummer_hersteller":string|null,"hersteller":string|null,"produkttyp":"verblender"|"riemchen"|"beides"|"daemmklinker"|null,"herstellung":"handform"|"strangpress"|"wasserstrich"|null,"farben":[],"formate":[],"oberflaeche":[],"technik":{"l":string|null,"b":string|null,"h":string|null,"gewicht":string|null,"druck":string|null,"wasser":string|null,"frost":"F0"|"F1"|"F2"|null,"bedarf":string|null,"staerke":string|null},"herstellertext":string|null,"hinweise":[]}

Regeln:
- Übernimm nur, was im Datenblatt steht. Nichts schätzen oder ergänzen. Fehlt ein Wert, setze null bzw. eine leere Liste.
- hersteller: möglichst einer aus dieser Liste, sonst der Name wie im Blatt: ${HERSTELLER.join(", ")}.
- produkttyp "beides", wenn das Blatt denselben Stein ausdrücklich als Vollstein und als Riemchen anbietet.
- farben: nur Werte aus ${Object.keys(FARBEN).join(", ")}. Ordne die Farbbeschreibung des Herstellers sinngemäß zu, Hauptfarbe zuerst. "nuanciert" bei deutlich wechselnden Tönen.
- formate: nur Kürzel aus ${FORMATE.map(f=>f.k).join(", ")}.
- oberflaeche: nur Werte aus ${OBERFL.join(", ")}.
- technik: Zahlen als Zeichenkette ohne Einheit, Dezimalkomma wie im Blatt. l, b, h in mm vom ersten genannten Format. gewicht in kg je Stein, druck in N/mm² (Mittelwert, falls genannt), wasser in Prozent, bedarf in Stück je m² laut Hersteller, staerke = Riemchenstärke in mm. frost als Kategorie nach EN 771-1.
- herstellertext: die beschreibende Produktbeschreibung aus dem Blatt, wortgetreu, höchstens 800 Zeichen.
- hinweise: bis zu 4 kurze Sätze auf Deutsch zu Unklarheiten, z. B. mehrere Formate mit verschiedenen Maßen oder widersprüchliche Angaben.
${text?`\nExtrahierter Text des Datenblatts (Tabellen können ungeordnet sein, die beigefügten Seitenbilder zeigen das Layout):\n"""\n${text.slice(0,40000)}\n"""`:"\nDas Datenblatt liegt als Bild bei."}`;
}
async function pdfToPages(file){
  if(!window.pdfjsLib) throw {code:"pdf",message:"Der PDF-Leser konnte nicht geladen werden. Lade das Datenblatt als Foto hoch."};
  try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}catch(e){}
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let text="";const maxImg=Math.min(intake.imgLimits?.maxCount||0,4),blobs=[];
  for(let i=1;i<=Math.min(pdf.numPages,8);i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();text+=`\n--- Seite ${i} ---\n`+tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("");
    if(i<=Math.max(maxImg,2)){
      const v0=page.getViewport({scale:1}),v=page.getViewport({scale:Math.min(2,1500/v0.width)});
      const c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);
      await page.render({canvasContext:c.getContext("2d"),viewport:v}).promise;
      intake.pages.push(c.toDataURL("image/jpeg",.6));
      if(i<=maxImg) blobs.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85)));
      renderIntake();
    }
  }
  return {text:text.trim(),blobs};
}
async function readSheet(file){
  if(intake.status==="reading"||intake.status==="thinking") return;
  Object.assign(intake,{status:"reading",file:file.name,pages:[],result:null,accept:{},msg:"",demo:false});
  renderIntake();
  if(!intake.sampler){
    try{if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)) await pdfToPages(file); else intake.pages=[URL.createObjectURL(file)];}catch(e){}
    intake.status="thinking";renderIntake();
    await new Promise(r=>setTimeout(r,1800));
    const name=file.name;demoIntake();intake.file=name+" (simuliert)";state.draft.datenblatt=name;renderIntake();return;}
  try{
    let text="",blobs=[];
    const isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name);
    if(isPdf){({text,blobs}=await pdfToPages(file));
      if(text.replace(/--- Seite \d+ ---/g,"").trim().length<40&&!blobs.length) throw {code:"empty",message:"Das PDF enthält keinen lesbaren Text. Lade es als Foto hoch."};}
    else{
      if(!intake.imgLimits) throw {code:"images_unavailable",message:"Fotos können in dieser Ansicht nicht gesendet werden. Lade das Datenblatt als PDF hoch."};
      blobs=[file];intake.pages=[URL.createObjectURL(file)];
    }
    intake.status="thinking";intake.ctl=new AbortController();renderIntake();
    const opts={signal:intake.ctl.signal,modelTier:"default"};if(blobs.length) opts.images=blobs;
    const raw=await intake.sampler.json(buildPrompt(text),opts);
    state.draft.datenblatt=file.name;
    showResult(normalize(raw&&typeof raw==="object"?raw:{}));
  }catch(e){
    if(e?.code==="cancelled"){intake.status="idle";renderIntake();return;}
    const map={not_granted:"Der Zugriff auf Claude wurde nicht erlaubt.",rate_limited:"Gerade zu viele Anfragen. Versuche es in einer Minute erneut.",
      image_rejected:"Die Datei ist zu groß oder kein lesbares Bild.",invalid_json:"Die Antwort war unvollständig. Bitte noch einmal versuchen.",
      refused:"Die KI hat dieses Dokument nicht ausgewertet.",prompt_too_large:"Das Datenblatt ist zu lang. Lade nur die Seite mit den Produktdaten hoch.",
      images_unavailable:"Fotos können in dieser Ansicht nicht gesendet werden. Lade das Datenblatt als PDF hoch.",sampling_disabled:"Claude ist für dieses Konto nicht verfügbar."};
    Object.assign(intake,{status:"error",msg:map[e?.code]||e?.message||"Unbekannter Fehler. Bitte erneut versuchen."});renderIntake();
  }
}
function showResult(res){
  intake.result=res;intake.status="review";intake.accept={};
  reviewRows().forEach(r=>intake.accept[r.k]=!r.blocked);renderIntake();
}
function applyIntake(){
  const d=state.draft;let n=0;
  reviewRows().forEach(r=>{if(!intake.accept[r.k]||r.blocked) return;
    const v=Array.isArray(r.v)?[...r.v]:r.v;
    if(r.k.startsWith("technik.")) d.technik[r.k.slice(8)]=v; else d[r.k]=v;
    d.ki.add(r.k);n++;});
  if(["technik.l","technik.b","technik.h"].some(k=>d.ki.has(k))) d.ki.add("masse");
  d.beispiel=false;intake.status="idle";intake.result=null;
  toast(`${n} Werte aus dem Datenblatt übernommen`);render();
}

function drawWall(){

/* ---------- Export ---------- */
function exportData(){
  const out=state.products.filter(p=>p.aktion!=="keine").map(p=>{
    if(p.aktion==="aktualisieren"&&p.quelle==="bestand"){const o={aktion:"aktualisieren",sku:p.sku};p.geaendert.forEach(f=>o[f]=p[f]);return o;}
    return {aktion:p.aktion,sku:p.sku,stein_id:p.stein_id||p.sku.replace(/ R$/,""),produkttyp:p.typ,hersteller:p.hersteller,herstellungsart:p.herstellung,
      bezeichnung_hersteller:p.bezeichnung||null,artikelnummer_hersteller:p.artikel_hersteller||null,farben:p.farben,formate:p.formate,oberflaeche:p.oberflaeche||[],
      technik:p.technik,herstellertext:p.herstellertext,aus_datenblatt:p.ki||[],datenblatt:p.datenblatt||null,
      texte_von_claude:p.claudeText!==false,seo:{titel:p.seoTitel,meta:p.meta},bilder:p.bilder||[],status:"entwurf"};});
  return {quelle:"Klinkerhandel Produktstation",erstellt:new Date().toISOString().slice(0,10),anzahl:out.length,produkte:out};
}

/* ---------- Aktionen ---------- */
function setPath(o,p,v){const k=p.split(".");while(k.length>1)o=o[k.shift()];o[k[0]]=v;}
function commitDraft(){
  const d=state.draft,missing=checks(d).filter(c=>c.req&&!c.ok);
  if(missing.length){state.step=missing[0].step;render();toast(`Noch offen: ${missing[0].l}`);return;}
  const bilder=d.bilder.map((b,i)=>({datei:dateiname(d,i),rolle:b.rolle,alt:altText(d,b),original:b.orig}));
  const make=(sku,typ)=>({sku,stein_id:d.sku.trim(),typ,hersteller:d.hersteller,herstellung:d.herstellung,bezeichnung:d.bezeichnung,artikel_hersteller:d.artikel_hersteller,
    farben:[...d.farben],formate:[...d.formate],oberflaeche:[...d.oberflaeche],technik:{...d.technik,bedarf:d.technik.bedarf||(bedarf(d)?Math.round(bedarf(d))+" (Richtwert)":"")},
    herstellertext:d.herstellertext,claudeText:d.claudeText,seoTitel:seoTitel(d),meta:metaText(d),bilder,bilderAnzahl:bilder.length+(d.keep?.anzahl||0),
    hatFreisteller:d.bilder.some(b=>b.rolle==="freisteller")||!!d.keep?.frei,ki:[...d.ki].filter(k=>k!=="masse"),datenblatt:d.datenblatt,quelle:"neu",aktion:"anlegen",geaendert:[]});
  const list=d.typ==="beides"?[make(d.sku.trim(),"verblender"),make(d.sku.trim()+" R","riemchen")]:[make(skus(d)[0],d.typ)];
  list.forEach(n=>{const i=state.products.findIndex(p=>p.sku===n.sku);
    if(i>-1){const old=state.products[i];n.quelle=old.quelle;n.aktion=old.quelle==="neu"?"anlegen":"aktualisieren";
      if(n.aktion==="aktualisieren") n.geaendert=["hersteller","herstellung","farben","formate","oberflaeche","technik","herstellertext"].concat(d.bilder.length?["bilder"]:[]);
      state.products[i]=n;} else state.products.unshift(n);});
  toast(`${list.map(p=>p.sku).join(" und ")} ${d.editSku?"aktualisiert":"im Sortiment"}`);
  state.draft=emptyDraft();state.step=0;go("sortiment");
}
function editProduct(sku){
  const p=state.products.find(x=>x.sku===sku);if(!p) return;
  const base=p.sku.replace(/ R$/,""),d=emptyDraft();
  Object.assign(d,{editSku:base,sku:base,typ:p.sku.endsWith(" R")?"riemchen":p.typ,hersteller:p.hersteller,herstellung:p.herstellung,farben:[...p.farben],formate:[...p.formate],
    oberflaeche:[...(p.oberflaeche||[])],herstellertext:p.herstellertext||"",bezeichnung:p.bezeichnung||"",artikel_hersteller:p.artikel_hersteller||"",datenblatt:p.datenblatt||null});
  if(state.products.find(x=>x.sku===base)&&state.products.find(x=>x.sku===base+" R")) d.typ="beides";
  Object.assign(d.technik,p.technik||{});d.keep={anzahl:p.bilderAnzahl||0,frei:!!p.hatFreisteller};
  state.draft=d;state.step=0;go("erfassen");
}
function addFiles(files){
  const d=state.draft;
  [...files].filter(f=>f.type.startsWith("image/")).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    d.bilder.push({id:"u"+(uid++),src:r.result,rolle:d.bilder.some(b=>b.rolle==="freisteller")||d.keep?.frei?"wand":"freisteller",w:im.naturalWidth,h:im.naturalHeight,orig:f.name});
    d.beispiel=false;rerenderForm();updateSide();};im.src=r.result;};r.readAsDataURL(f);});
}
function rerenderForm(){const f=$("#form");if(f){f.innerHTML=stepBody(state.draft);bindForm();}
  document.querySelectorAll(".step").forEach((b,i)=>{const done=stepDone(state.draft,i)&&i!==state.step;b.classList.toggle("done",done);b.querySelector(".dot").textContent=done?"✓":i+1;});}
function go(v){state.view=v;if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);render();window.scrollTo({top:0});}
function bindForm(){
  const drop=$("#drop");
  if(drop){["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t) return;const d=state.draft;
  if(t.dataset.view){go(t.dataset.view);return;}
  if(t.dataset.step!==undefined&&state.view==="erfassen"){state.step=+t.dataset.step;render();return;}
  if(t.dataset.pick){d[t.dataset.pick]=t.dataset.val;d.ki.delete(t.dataset.pick);d.beispiel=false;rerenderForm();updateSide();return;}
  if(t.dataset.toggle){const a=d[t.dataset.toggle],v=t.dataset.val,i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);d.ki.delete(t.dataset.toggle);d.beispiel=false;rerenderForm();updateSide();return;}

  if(t.dataset.imgdel!==undefined){d.bilder.splice(+t.dataset.imgdel,1);rerenderForm();updateSide();return;}
  if(t.dataset.edit){editProduct(t.dataset.edit);return;}

  const a=t.dataset.act;

      const mark=f=>{if(!p.geaendert.includes(f))p.geaendert.push(f);if(p.aktion==="keine")p.aktion="aktualisieren";};

      if(fo&&!p.formate.includes(fo)){p.formate.push(fo);mark("formate");}});
    toast(`${n} Produkte geändert`);render();}
  if(a==="download"){const blob=new Blob([JSON.stringify(exportData(),null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);
    const l=document.createElement("a");l.href=u;l.download="produkte-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("JSON gespeichert");}
  if(a==="copy"){const txt=JSON.stringify(exportData(),null,2);
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($("#json"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Text markiert, jetzt mit Strg+C kopieren");};
    try{navigator.clipboard.writeText(txt).then(()=>toast("JSON kopiert"),fallback);}catch(err){fallback();}}
});
document.addEventListener("input",e=>{

      $("#skuMsg").className="msg "+ss.cls;$("#skuMsg").innerHTML=esc(ss.msg)+(ss.dup?` <button class="link-btn" data-act="loadDup" data-sku="${esc(ss.dup)}">Bestehendes laden</button>`:"");}
