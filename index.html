<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Klinkerhandel Produktstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* Layout: helle Arbeitsfläche, weiße Kopfleiste mit rotem Markenstrich. Bestand = Kennzahlen, „Wo ansetzen“, Tabelle mit Lücken. Nur heller Modus (bewusst). */
:root{
  color-scheme:light;
  --ink:#0b1519;--signal:#c8161d;--signal-soft:#fcefef;--clay:#a8452f;
  --bg:#f5f6f7;--surface:#ffffff;--surface-2:#f9fafb;--line:#e3e6e9;--line-strong:#cfd4d8;
  --text:#212934;--muted:#636b75;--faint:#8b929a;
  --ok:#1d7148;--ok-soft:#e8f4ee;--warn:#8f5c00;--warn-soft:#fdf4e3;--warn-dot:#d39a2c;--bad:#b0161b;--bad-soft:#fcecec;
  --ai:#2f5d8a;--ai-soft:#eaf1f8;--ai-line:#c6d7e8;--serp-link:#1a0dab;--serp-text:#4d5156;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--r:6px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--font-body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
a{color:var(--signal)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--signal)}
.top-in{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:10px 0;max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding-bottom:10px}
.brand-mark{width:26px;height:18px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.5px}
.brand-mark i{background:var(--signal)}
.brand-mark i:nth-child(1){grid-column:1/3}.brand-mark i:nth-child(2){grid-column:3/5}.brand-mark i:nth-child(3){grid-column:1/2}.brand-mark i:nth-child(4){grid-column:2/4}.brand-mark i:nth-child(5){grid-column:4/5}.brand-mark i:nth-child(6){grid-column:1/3;opacity:.45}.brand-mark i:nth-child(7){grid-column:3/5;opacity:.45}
.brand-txt b{display:block;font-weight:600;font-size:14px;line-height:1.15}
.brand-txt span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;align-self:flex-end}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px 10px;cursor:pointer;font-size:13px;font-weight:500;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab .cnt{font-family:var(--font-mono);font-size:10.5px;background:var(--bg);border:1px solid var(--line);padding:0 6px;border-radius:999px;color:var(--muted)}

main{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.view-head .acts{display:flex;gap:8px;flex-wrap:wrap}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;color:var(--ink)}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
.lead{color:var(--muted);max-width:72ch;margin:4px 0 0}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}

/* Bestand */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:16px;overflow:hidden}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px;background:none;border-top:0;border-left:0;text-align:left;cursor:pointer}
.kpi:hover{background:var(--surface-2)}
.kpi[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--signal)}
.kpi b{display:block;font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.static{cursor:default}
.kpi.static:hover{background:none}
.grid-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
@media (max-width:980px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.box{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li button{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) 70px auto;gap:10px;align-items:center;background:none;border:0;border-radius:4px;padding:6px 6px;cursor:pointer;text-align:left;font-size:12.5px}
@media (max-width:520px){.checks li button{grid-template-columns:10px minmax(0,1fr) auto}.checks li button .bar2{display:none}}
.checks li button:hover{background:var(--surface-2)}
.checks li button[aria-pressed="true"]{background:var(--signal-soft)}
.checks .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 6px 4px}
.checks .grp:first-child{padding-top:0}
.bar2{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar2 i{display:block;height:100%}
.num{font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--text);white-space:nowrap;min-width:84px}
.lamp{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.lamp.ok{background:var(--ok)}.lamp.bad{background:var(--bad)}.lamp.warn{background:var(--warn-dot)}.lamp.info{background:var(--line-strong)}
.global{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.global li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.global li:first-child{border-top:0;padding-top:0}
.global b{font-weight:600;font-size:12.5px}
.global .val{font-family:var(--font-mono);font-size:12px;color:var(--bad);white-space:nowrap}
.global .val.w{color:var(--warn)}
.global p{grid-column:1/-1;margin:0;font-size:12px;color:var(--muted)}
.global .link-btn{justify-self:start}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input[type=text]{max-width:240px}
.toolbar select{width:auto;max-width:100%}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.filters-active{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 4px 2px 9px;border-radius:999px;background:var(--signal-soft);color:var(--signal);border:1px solid #efc3c5}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 5px;font-size:13px;line-height:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;min-width:1080px;font-size:12.5px}
.data th,.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.data th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;background:var(--surface-2);white-space:nowrap}
.data th button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.data tbody tr.row{cursor:pointer}
.data tbody tr.row:hover{background:var(--surface-2)}
.data tbody tr.sel{background:var(--signal-soft)}
.data tbody tr.open{background:var(--surface-2)}
.data input[type=checkbox]{width:15px;height:15px;accent-color:var(--signal)}
.data .nm{max-width:240px;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap;max-width:300px}
.tg{font-size:10.5px;padding:1px 7px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.tg.p{background:var(--bad-soft);color:var(--bad)}
.tg.e{background:var(--warn-soft);color:var(--warn)}
.tg.more{color:var(--muted);border-color:var(--line)}
.miss{font-size:11px;color:var(--bad)}
.changed{box-shadow:inset 0 -2px 0 var(--warn-dot)}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:120px}
.dots i{width:11px;height:11px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.bar{width:56px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%}
.detail td{background:var(--surface-2);padding:14px 16px 18px}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:1000px){.det{grid-template-columns:minmax(0,1fr)}}
.det h3{margin-bottom:6px}
.det dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:12.5px}
.det dt{color:var(--muted)}
.det dd{margin:0;min-width:0;word-break:break-word}
.det ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.det ul li{display:flex;gap:8px;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.thumbs figure{margin:0;display:flex;flex-direction:column;gap:2px}
.thumbs .t{aspect-ratio:1;background:var(--surface) center/cover no-repeat;border:1px solid var(--line);border-radius:4px;max-width:100%;display:grid;place-items:center;font-size:9px;color:var(--faint);overflow:hidden}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs figcaption{font-size:9.5px;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs figcaption.noalt{color:var(--bad)}
.more-row{display:flex;justify-content:center;gap:10px;padding:12px;align-items:center}
.bulk{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--surface);border:1px solid var(--line-strong);border-left:3px solid var(--signal);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(11,21,25,.12);z-index:5}
.bulk b{font-size:13px;font-weight:600;margin-right:4px}
.bulk select{width:auto;max-width:100%}
details.help{margin-top:16px}
details.help summary{cursor:pointer;font-weight:500;font-size:12.5px;color:var(--muted)}
.code-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.bm{display:inline-flex;gap:6px;align-items:center;border:1px dashed var(--signal);color:var(--signal);border-radius:6px;padding:6px 10px;text-decoration:none;font-weight:500;font-size:12.5px;cursor:grab}

/* Erfassen (wie bisher) */
.intake{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);margin-bottom:18px;overflow:hidden}
@media (max-width:820px){.intake{grid-template-columns:minmax(0,1fr)}}
.intake-drop{padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
@media (max-width:820px){.intake-drop{border-right:0;border-bottom:1px solid var(--line)}}
.dz{border:1px dashed var(--line-strong);border-radius:6px;padding:16px;text-align:center;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.dz:hover{border-color:var(--ai)}
.dz.over{border-color:var(--ai);background:var(--ai-soft)}
.dz svg{width:22px;height:22px;color:var(--ai)}
.dz b{font-weight:600;font-size:13px}
.intake-body{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ai-chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ai);background:var(--ai-soft);border:1px solid var(--ai-line);padding:2px 7px;border-radius:999px}
.ai-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.ai-steps{grid-template-columns:minmax(0,1fr)}}
.ai-steps li{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.ai-steps li b{display:block;color:var(--text);font-size:12.5px;font-weight:600;margin-bottom:2px}
.progress{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pages img{width:52px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.spin{width:16px;height:16px;border:2px solid var(--ai-line);border-top-color:var(--ai);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.review-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.review{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
.review th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.review td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.review tr:last-child td{border-bottom:0}
.review td:first-child{width:28px}
.review td:nth-child(2){color:var(--muted);width:160px}
.review input{width:15px;height:15px;accent-color:var(--ai);margin:2px 0 0}
.review .old{color:var(--faint);text-decoration:line-through;margin-right:6px}
.notes{margin:0;padding-left:18px;color:var(--warn);font-size:12.5px}
.studio{display:grid;grid-template-columns:190px minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:1180px){.studio{grid-template-columns:minmax(0,1fr) 300px}.steps{grid-column:1/-1}}
@media (max-width:860px){.studio{grid-template-columns:minmax(0,1fr)}}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px}
@media (max-width:1180px){.steps{position:static;flex-direction:row;overflow-x:auto;border-bottom:1px solid var(--line)}}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:0 6px 6px 0;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);white-space:nowrap;border-left:2px solid transparent}
@media (max-width:1180px){.step{border-left:0;border-bottom:2px solid transparent;border-radius:0}}
.step:hover{color:var(--text)}
.step[aria-current="step"]{color:var(--ink);border-left-color:var(--signal);background:var(--surface)}
@media (max-width:1180px){.step[aria-current="step"]{border-bottom-color:var(--signal);background:none}}
.step .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line-strong);flex:none;background:var(--surface)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step[aria-current="step"] .dot{border-color:var(--signal);color:var(--signal)}
.step b{display:block;font-weight:500;font-size:13px}
.step small{font-size:11px;color:var(--faint)}
.form{padding:22px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:600px){.form{padding:16px}}
.form-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag.example{background:var(--warn-soft);color:var(--warn)}
.tag.live{background:var(--ok-soft);color:var(--ok)}
.ki{display:inline-flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ai);background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:999px;padding:0 6px;line-height:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:500;font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--text)}
.req{color:var(--signal)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;min-height:36px;font-size:13px}
textarea{min-height:120px;resize:vertical;line-height:1.55}
input:hover,select:hover,textarea:hover{border-color:#aeb5bb}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(11,21,25,.08)}
input.invalid{border-color:var(--bad);background:var(--bad-soft)}
input.valid{border-color:var(--ok)}
.from-ai{border-color:var(--ai-line)!important;background:var(--ai-soft)!important}
.msg{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}.msg.muted{color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.choice{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.choice:hover{border-color:#9ea6ac}
.choice[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);background:var(--signal-soft)}
.choice b{font-size:13px;font-weight:600}
.choice small{color:var(--muted);font-size:11.5px;line-height:1.35}
.choice svg{width:72px;height:22px;margin-bottom:3px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.sw{border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px;text-align:left}
.sw .chip2{width:22px;height:16px;border-radius:2px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw:hover{border-color:var(--line-strong)}
.sw[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);font-weight:600}
.sw .ord{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--signal)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.pill:hover{border-color:#9ea6ac}
.pill[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);background:var(--signal-soft)}
.pill small{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.pill.static{cursor:default}
.calc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface-2)}
@media (max-width:600px){.calc{grid-template-columns:minmax(0,1fr)}}
.wall{width:180px;height:110px;border-radius:4px;max-width:100%}
.calc-num{font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.calc-num small{font-size:12px;font-weight:400;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--signal)}
.drop{border:1px dashed var(--line-strong);border-radius:8px;padding:18px;text-align:center;background:var(--surface-2);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--signal);background:var(--signal-soft)}
.drop b{display:block;font-size:13px;font-weight:600}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.img{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.img .ph{aspect-ratio:4/3;background:var(--surface-2) center/cover no-repeat;position:relative;max-width:100%}
.img .ph .no{position:absolute;top:6px;left:6px;background:var(--surface);color:var(--ink);font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:3px}
.img .ph .lowres{position:absolute;bottom:6px;left:6px;right:6px;background:var(--warn-soft);color:var(--warn);font-size:11px;padding:2px 6px;border-radius:3px}
.img .meta{padding:9px;display:flex;flex-direction:column;gap:6px}
.img select{min-height:32px;padding:4px 8px;font-size:12.5px}
.img .fn{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);word-break:break-all}
.img .acts{display:flex;gap:5px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;min-width:30px;height:28px;cursor:pointer;font-size:12px;padding:0 8px;color:var(--muted)}
.icon-btn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.icon-btn:disabled{opacity:.4}
.serp{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:2px;font-family:Arial,sans-serif}
.serp .u{font-size:12px;color:var(--serp-text)}
.serp .t{color:var(--serp-link);font-size:18px;line-height:1.3}
.serp .d{font-size:13px;color:var(--serp-text)}
.meter{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.over i{background:var(--bad)}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--signal);margin-top:2px;flex:none}
.toggle b{font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:500;font-size:13px;min-height:36px;display:inline-flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;color:var(--text)}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#22323a}
.btn.red{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--signal);font-weight:500;cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){.side{position:static}}
.preview{overflow:hidden}
.pv-img{aspect-ratio:4/3;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;color:var(--faint);font-size:12px;max-width:100%;border-bottom:1px solid var(--line)}
.pv-body{padding:14px;display:flex;flex-direction:column;gap:6px}
.pv-title{font-weight:600;font-size:14px;line-height:1.35;color:var(--ink)}
.pv-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;border-top:1px solid var(--line);padding-top:6px}
.pv-row span:first-child{color:var(--muted)}
.pv-link{font-size:12px;color:var(--signal);font-weight:500}
.check{padding:14px;display:flex;flex-direction:column;gap:10px}
.check-head{display:flex;align-items:center;gap:12px}
.ring{width:48px;height:48px;flex:none}
.ring text{font-family:var(--font-mono);font-size:12px;font-weight:500;fill:var(--text)}
.check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.check li button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;padding:5px 4px;border-radius:4px;cursor:pointer;text-align:left;font-size:12.5px}
.check li button:hover{background:var(--surface-2)}
.check li .t2{margin-left:auto;font-size:10.5px;color:var(--faint)}

/* Export */
.exp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.exp{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{padding:10px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.code{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:16px;font-family:var(--font-mono);font-size:11.5px;line-height:1.65;overflow:auto;max-height:640px;white-space:pre;margin:0}
.code .k{color:#8a2a2e}.code .s{color:var(--ok)}.code .n{color:var(--warn)}.code .b{color:var(--ai)}
.flow{display:flex;flex-direction:column;gap:8px;font-size:12.5px;margin:0;padding:0;list-style:none;counter-reset:f}
.flow li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.flow li::before{counter-increment:f;content:counter(f);width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

      bilder,ds:p.beschreibung_laenge||0,tg:p.schlagwoerter||0,fm:!!p.formular_im_kurztext,ph:!!p.preishinweis_im_kurztext,links:p.produktlinks||[],

function pruefeAlle(){
  const P=state.products,byKey={},slugs=new Set(P.map(p=>p.slug)),codes=new Set(),refBy={};
  P.forEach(p=>{if((p.art==="verblender"||p.art==="riemchen")&&p.code){(byKey[p.code+"|"+p.art]=byKey[p.code+"|"+p.art]||[]).push(p.id);codes.add(p.code);}});
  P.forEach(p=>{if(p.art==="referenz"&&p.code) refBy[p.code]=(refBy[p.code]||0)+1;});
  P.forEach(p=>{
    const pr=[],add=k=>pr.push(k),files=p.bilder.map(b=>b.d);
    if(p.art==="verblender"||p.art==="riemchen"){
      if(!p.code) add("code"); else if(!p.codeOk) add("codeform");
      if(!p.hersteller.length) add("hersteller"); if(p.hersteller.length>1) add("hersteller2");
      if(!p.herstellung.length) add("herstellung");
      if(!p.farben.length) add("farbe"); if(!p.formate.length) add("format");
      if(p.code&&(byKey[p.code+"|"+p.art]||[]).length>1) add("dublette");
      if((/ R\b/.test(p.name)||/^Riemchen/.test(p.name))!==(p.art==="riemchen")) add("typ");
      const other=p.art==="verblender"?"riemchen":"verblender";
      p.partner=p.code?((byKey[p.code+"|"+other]||[])[0]||null):null; p.refs=refBy[p.code]||0;
      if(p.kf&&!p.geaendert.includes("formate")){const tf=new Set(p.kf.map(t=>TXTFMT[t.toUpperCase()]||TXTFMT[t]||"?"));if(tf.has("?")||tf.size!==new Set(p.formate).size||[...tf].some(t=>!p.formate.includes(t))) add("abgleich_format");}
      if(p.kc&&!p.geaendert.includes("farben")){const tc=new Set(p.kc.map(t=>t==="rosa"?"rose":t));if(tc.size!==new Set(p.farben).size||[...tc].some(t=>!p.farben.includes(t))) add("abgleich_farbe");}
      if(!files.length) add("bild0"); else if(files.length<3) add("bilder3");
      if(!p.ds&&!p.herstellertext) add("text");
    } else if(p.art==="referenz"){
      if(!p.code) add("ref_code"); else if(!codes.has(p.code)) add("ref_ohne_produkt");
      if(!p.links.length) add("ref_links"); else if(p.links.some(l=>!slugs.has(l.replace(/\/$/,"").split("/").pop()))) add("ref_link_tot");
      if(!p.ref.length) add("ref_kategorie"); if(!p.ds) add("ref_text");
      if(!files.length) add("bild0");
    } else if(p.art==="nistklinker"){
      if(!p.hersteller.length) add("hersteller"); if(!files.length) add("bild0"); if(!p.ds&&!p.herstellertext) add("text");
    } else if(p.art==="sonstiges"){
      add("kategorie"); if(!files.length) add("bild0");
    }
    if(files.length!==new Set(files).size) add("bild_doppelt");
    if(p.bilder.some(b=>!b.alt)) add("alt");
    p.pr=pr;
    const grp=p.art==="referenz"?"ref":p.art==="nistklinker"?"nist":p.art==="sonstiges"?"sonst":"prod";
    const ap=APPLIES[grp],tot=ap.reduce((a,k)=>a+CHECKS[k].w,0),bad=pr.filter(k=>k!=="codeform"||!pr.includes("code")).reduce((a,k)=>a+(ap.includes(k==="codeform"?"code":k)?CHECKS[k].w:0),0);
    p.score=p.art==="neu"?100:Math.max(0,Math.round((1-bad/tot)*100));
  });
}
function grpOf(p){return p.art==="referenz"?"ref":(p.art==="verblender"||p.art==="riemchen"||p.art==="neu")?"prod":"other";}

function gefiltert(){
  const f=state.f,q=f.q.trim().toLowerCase();
  let rows=state.products.filter(p=>{
    if(f.art==="prod"&&!(p.art==="verblender"||p.art==="riemchen"||p.art==="neu")) return false;
    if(f.art!=="prod"&&f.art!=="alle"&&p.art!==f.art) return false;
    if(f.herst==="__none"&&p.hersteller.length) return false;
    if(f.herst&&f.herst!=="__none"&&!p.hersteller.includes(f.herst)) return false;
    if(f.lucke==="__partner"&&!(p.code&&(p.art==="verblender"||p.art==="riemchen")&&!p.partner)) return false;
    if(f.lucke==="__geaendert"&&p.aktion==="keine") return false;
    if(f.lucke&&!f.lucke.startsWith("__")&&!p.pr.includes(f.lucke)) return false;
    if(q&&!(p.name+" "+p.code+" "+p.hersteller.join(" ")+" "+p.altNr+" "+p.id).toLowerCase().includes(q)) return false;
    return true;});
  if(f.sort==="score") rows.sort((a,b)=>a.score-b.score||a.code.localeCompare(b.code));
  if(f.sort==="code") rows.sort((a,b)=>(a.code||"~").localeCompare(b.code||"~")||a.art.localeCompare(b.art));
  if(f.sort==="hersteller") rows.sort((a,b)=>(a.hersteller[0]||"~").localeCompare(b.hersteller[0]||"~")||a.code.localeCompare(b.code));
  if(f.sort==="bilder") rows.sort((a,b)=>a.bilder.length-b.bilder.length);
  return rows;
}

async function pdfToPages(file){

  <div class="panel check"><div class="check-head"><svg class="ring" viewBox="0 0 48 48" role="img" aria-label="Vollständigkeit ${sc} Prozent"><circle cx="24" cy="24" r="20" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="24" cy="24" r="20" fill="none" stroke="${scoreCol(sc)}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-sc/100)}" transform="rotate(-90 24 24)"/><text x="24" y="28" text-anchor="middle">${sc}%</text></svg>
    <div><h3>Checkliste</h3><span class="hint">${open?`${open} Pflichtangabe${open>1?"n fehlen":" fehlt"}`:"Alle Pflichtangaben vollständig"}</span></div></div>
    <ul>${c.map(x=>`<li><button data-step="${x.step}"><span class="lamp ${x.ok?"ok":x.req?"bad":"warn"}"></span>${x.l}<span class="t2">${x.req?"Pflicht":"Empfohlen"}</span></button></li>`).join("")}</ul></div>`;
  drawWall();
}
function drawWall(){const cv=$("#wall");if(!cv) return;const d=state.draft,x=cv.getContext("2d");const l=num(d.technik.l)||210,h=num(d.technik.h)||65,f=num(d.technik.fuge)||10,sc=360/1000;
  x.fillStyle="#cdc8be";x.fillRect(0,0,360,220);const cols=d.farben.map(c=>FARBEN[c]).filter(c=>c&&c.startsWith("#"));const pal=cols.length?cols:["#a8452f","#93402c","#b5583a"];
  let r=0;for(let y=0;y<220;y+=(h+f)*sc,r++){for(let xx=(r%2?-(l+f)/2:0)*sc;xx<360;xx+=(l+f)*sc){x.fillStyle=pal[Math.abs(Math.round(xx*7+y*3))%pal.length];x.fillRect(xx,y,l*sc,h*sc)}}
  const v=bedarf(d),el=$("#calcNum");if(el) el.innerHTML=v?`≈ ${Math.round(v)} <small>Stk./m² bei ${f} mm Fuge</small>`:"–";const fv=$("#fugeVal");if(fv) fv.textContent=f+" mm";}

/* =========================================================
   Export
   ========================================================= */
function exportData(){
  const out=state.products.filter(p=>p.aktion!=="keine").map(p=>{
    if(p.aktion==="aktualisieren"){const o={aktion:"aktualisieren",id:p.id,sku:p.sku||null,code:p.code};p.geaendert.forEach(f=>o[f]=p[f]);return o;}
    return {aktion:"anlegen",sku:p.sku,stein_id:p.code,produkttyp:p.typNeu,hersteller:p.hersteller[0]||null,herstellungsart:p.herstellung[0]||null,bezeichnung_hersteller:p.bezeichnung||null,
      artikelnummer_hersteller:p.artikel_hersteller||null,farben:p.farben,formate:p.formate,oberflaeche:p.oberflaeche||[],technik:p.technik,herstellertext:p.herstellertext,aus_datenblatt:p.ki||[],
      datenblatt:p.datenblatt||null,texte_von_claude:p.claudeText!==false,seo:{titel:p.seoTitel,meta:p.meta},bilder:p.bilderNeu||[],status:"entwurf"};});
  return {quelle:"Klinkerhandel Produktstation",erstellt:new Date().toISOString().slice(0,10),bestand_stand:META.stand||null,anzahl:out.length,produkte:out};
}
function hl(json){return esc(json).replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="k">$1</span>$2').replace(/:\s(&quot;.*?&quot;)/g,': <span class="s">$1</span>').replace(/:\s(-?\d[\d.]*)/g,': <span class="n">$1</span>').replace(/:\s(true|false|null)/g,': <span class="b">$1</span>');}
function viewExport(){
  const data=exportData(),js=JSON.stringify(data,null,2),neu=data.produkte.filter(p=>p.aktion==="anlegen").length,upd=data.produkte.length-neu;
  const shown=data.produkte.length>40?JSON.stringify({...data,produkte:data.produkte.slice(0,40)},null,2)+"\n… "+(data.produkte.length-40)+" weitere im Download":js;
  return `<div class="view-head"><div><div class="eyebrow">Übergabe an Claude</div><h1>Export</h1><p class="lead">Das Paket enthält nur neue und geänderte Produkte. Bestehende Produkte werden über die Produkt-ID gefunden und nur in den geänderten Feldern aktualisiert. Neue entstehen als Entwurf.</p></div></div>
  <div class="exp"><div class="panel" style="padding:16px;display:flex;flex-direction:column;gap:14px">
    <div class="stats"><div class="stat"><b>${neu}</b><span>neu</span></div><div class="stat"><b>${upd}</b><span>Updates</span></div><div class="stat"><b>${fmtN(state.products.length-data.produkte.length)}</b><span>unverändert</span></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="download" ${data.produkte.length?"":"disabled"}>JSON herunterladen</button><button class="btn" data-act="copy" ${data.produkte.length?"":"disabled"}>Kopieren</button></div>
    <h3>So geht es weiter</h3><ol class="flow"><li>Paket an Claude geben</li><li>Claude prüft Lücken und Dubletten und schreibt die Texte</li><li>Anlage bzw. Aktualisierung im Shop als Entwurf</li><li>Freigabe, dann online</li></ol></div>
  <div style="min-width:0">${data.produkte.length?`<pre class="code" id="json">${hl(shown)}</pre>`:`<div class="panel" style="padding:24px"><h2>Noch nichts zu exportieren</h2><p class="lead">Ändere im Bestand mehrere Produkte auf einmal, bearbeite eins im Formular oder erfasse ein neues. Danach erscheint hier das Paket.</p></div>`}</div></div>`;
}

/* =========================================================
   Render, Aktionen
   ========================================================= */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.view===state.view?"page":"false"));
  $("#cntBestand").textContent=fmtN(state.products.filter(p=>p.art!=="neu").length);
  $("#cntExp").textContent=state.products.filter(p=>p.aktion!=="keine").length;
  const app=$("#app");
  if(state.view==="bestand") app.innerHTML=viewBestand();
  if(state.view==="erfassen"){app.innerHTML=viewErfassen();renderIntake();updateSide();bindForm();}
  if(state.view==="export") app.innerHTML=viewExport();
}
function renderTable(){const t=$("#tbl");if(t) t.innerHTML=tabelle();const old=document.querySelector(".bulk");const nb=bulkBar();
  if(old) old.outerHTML=nb||""; else if(nb){t.insertAdjacentHTML("afterend",nb);} }
function setPath(o,p,v){const k=p.split(".");while(k.length>1)o=o[k.shift()];o[k[0]]=v;}
function go(v){state.view=v;if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);render();window.scrollTo({top:0});}
function mark(p,f){if(!p.geaendert.includes(f)) p.geaendert.push(f);if(p.aktion==="keine") p.aktion="aktualisieren";}
function editProduct(id){
  const p=state.products.find(x=>x.id===id);if(!p) return;
  const d=emptyDraft();const partner=p.partner?state.products.find(x=>x.id===p.partner):null;
  Object.assign(d,{editId:p.id,editPartner:null,sku:p.code||"",typ:p.art==="riemchen"?"riemchen":p.art==="neu"?p.typNeu:"verblender",hersteller:p.hersteller[0]||"",herstellung:p.herstellung[0]||"",
    farben:[...p.farben],formate:[...p.formate],oberflaeche:[...(p.oberflaeche||[])],herstellertext:p.herstellertext||"",bezeichnung:p.bezeichnung||"",artikel_hersteller:p.artikel_hersteller||"",
    datenblatt:p.datenblatt||null,slug:p.slug,altKurztext:p.ktx,keepFirst:p.bilder[0]?.d||""});
  Object.assign(d.technik,p.technik||{});d.keep={anzahl:p.bilder.length,frei:p.bilder.length>0,ohneAlt:p.bilder.filter(b=>!b.alt).length};
  state.draft=d;state.step=0;go("erfassen");
  if(partner) toast(`Gegenstück ${partner.code}${partner.art==="riemchen"?" R":""} vorhanden – Änderungen gelten nur für dieses Produkt`);
}
function commitDraft(){
  const d=state.draft,missing=checksD(d).filter(c=>c.req&&!c.ok);
  if(missing.length){state.step=missing[0].step;render();toast(`Noch offen: ${missing[0].l}`);return;}
  if(d.editId){
    const p=state.products.find(x=>x.id===d.editId);
    const setF=(f,v)=>{if(JSON.stringify(p[f])!==JSON.stringify(v)){p[f]=v;mark(p,f);}};
    setF("hersteller",d.hersteller?[d.hersteller]:[]);setF("herstellung",d.herstellung?[d.herstellung]:[]);setF("farben",[...d.farben]);setF("formate",[...d.formate]);
    setF("oberflaeche",[...d.oberflaeche]);setF("herstellertext",d.herstellertext);setF("bezeichnung",d.bezeichnung);setF("artikel_hersteller",d.artikel_hersteller);
    const tech={...d.technik};delete tech.fuge;if(Object.values(tech).some(v=>v)) setF("technik",tech);
    if(!p.sku&&p.code){setF("sku",p.code+(p.art==="riemchen"?" R":""));}
    if(d.bilder.length){p.bilderNeu=d.bilder.map((b,i)=>({datei:dateiname(d,i),rolle:b.rolle,alt:altText(d,b),original:b.orig}));mark(p,"bilderNeu");}
    if(d.datenblatt){p.datenblatt=d.datenblatt;mark(p,"datenblatt");}
    pruefeAlle();toast(`${p.code}${p.art==="riemchen"?" R":""} aktualisiert (${p.geaendert.length} Felder)`);
    state.draft=emptyDraft();state.step=0;state.open=p.id;go("bestand");return;
  }
  const bilder=d.bilder.map((b,i)=>({datei:dateiname(d,i),rolle:b.rolle,alt:altText(d,b),original:b.orig}));
  const make=(sku,typ)=>({id:"neu-"+(uid++),name:produktName(d,typ==="riemchen"),slug:"",art:"neu",typNeu:typ,quelle:"neu",aktion:"anlegen",geaendert:[],code:d.sku.trim(),codeOk:true,sku,altNr:"",
    hersteller:d.hersteller?[d.hersteller]:[],herstellung:d.herstellung?[d.herstellung]:[],farben:[...d.farben],formate:[...d.formate],ref:[],kf:null,kc:null,
    bilder:bilder.map(b=>({d:b.datei,w:800,alt:b.alt})),bilderNeu:bilder,ds:0,tg:0,fm:false,links:[],ktx:"",attr:0,oberflaeche:[...d.oberflaeche],
    technik:{...d.technik,bedarf:d.technik.bedarf||(bedarf(d)?Math.round(bedarf(d))+" (Richtwert)":"")},herstellertext:d.herstellertext,claudeText:d.claudeText,
    bezeichnung:d.bezeichnung,artikel_hersteller:d.artikel_hersteller,seoTitel:seoTitel(d),meta:metaText(d),ki:[...d.ki].filter(k=>k!=="masse"),datenblatt:d.datenblatt});
  const list=d.typ==="beides"?[make(d.sku.trim(),"verblender"),make(d.sku.trim()+" R","riemchen")]:[make(skus(d)[0],d.typ)];
  state.products.unshift(...list);pruefeAlle();
  toast(`${list.map(p=>p.sku).join(" und ")} angelegt`);state.draft=emptyDraft();state.step=0;state.f.lucke="__geaendert";state.f.art="alle";go("bestand");
}
function addFiles(files){const d=state.draft;
  [...files].filter(f=>f.type.startsWith("image/")).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    d.bilder.push({id:"u"+(uid++),src:r.result,rolle:d.bilder.some(b=>b.rolle==="freisteller")||d.keep?.frei?"wand":"freisteller",w:im.naturalWidth,h:im.naturalHeight,orig:f.name});rerenderForm();updateSide();};im.src=r.result;};r.readAsDataURL(f);});}
function rerenderForm(){const f=$("#form");if(f){f.innerHTML=stepBody(state.draft);bindForm();}
  document.querySelectorAll(".step").forEach((b,i)=>{const done=stepDone(state.draft,i)&&i!==state.step;b.classList.toggle("done",done);b.querySelector(".dot").textContent=done?"✓":i+1;});}
function bindForm(){const drop=$("#drop");
  if(drop){["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));drop.addEventListener("drop",ev=>addFiles(ev.dataTransfer.files));}
  const fi=$("#f-img");if(fi) fi.addEventListener("change",()=>addFiles(fi.files));drawWall();}
function filterSet(patch){Object.assign(state.f,patch);state.limit=60;state.open=null;render();const t=$("#tbl");if(t&&patch.scroll!==false) t.scrollIntoView({behavior:"smooth",block:"start"});}

document.addEventListener("click",e=>{
  const kp=e.target.closest("[data-kpi]");if(kp){filterSet({art:kp.dataset.kpi,lucke:""});return;}
  const lk=e.target.closest("[data-lucke]");if(lk){const k=lk.dataset.lucke;filterSet({lucke:state.f.lucke===k&&lk.closest(".checks")?"":k,art:lk.dataset.scope||state.f.art});return;}
  const ed=e.target.closest("[data-edit]");if(ed){editProduct(isNaN(+ed.dataset.edit)?ed.dataset.edit:+ed.dataset.edit);return;}
  const jp=e.target.closest("[data-jump]");if(jp){const id=+jp.dataset.jump;const p=state.products.find(x=>x.id===id);Object.assign(state.f,{q:String(id),lucke:"",herst:"",art:p?.art||"alle"});state.open=id;render();return;}
  if(e.target.closest("input,select,a,label")&&!e.target.closest("button")) return;
  const row=e.target.closest("tr.row");if(row&&!e.target.closest("button")){const id=isNaN(+row.dataset.row)?row.dataset.row:+row.dataset.row;state.open=state.open===id?null:id;renderTable();return;}
  const t=e.target.closest("button");if(!t) return;const d=state.draft;
  if(t.dataset.view){go(t.dataset.view);return;}
  if(t.dataset.art){filterSet({art:t.dataset.art,scroll:false});return;}
  if(t.dataset.step!==undefined&&state.view==="erfassen"){state.step=+t.dataset.step;render();return;}
  if(t.dataset.pick){d[t.dataset.pick]=t.dataset.val;d.ki.delete(t.dataset.pick);rerenderForm();updateSide();return;}
  if(t.dataset.toggle){const a=d[t.dataset.toggle],v=t.dataset.val,i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);d.ki.delete(t.dataset.toggle);rerenderForm();updateSide();return;}
  if(t.dataset.imgmove!==undefined){const i=+t.dataset.imgmove,j=i+ +t.dataset.dir;[d.bilder[i],d.bilder[j]]=[d.bilder[j],d.bilder[i]];rerenderForm();updateSide();return;}
  if(t.dataset.imgdel!==undefined){d.bilder.splice(+t.dataset.imgdel,1);rerenderForm();updateSide();return;}
  const a=t.dataset.act;
  if(a==="next"){state.step=Math.min(4,state.step+1);render();}
  if(a==="prev"){state.step=Math.max(0,state.step-1);render();}
  if(a==="commit") commitDraft();
  if(a==="newDraft"){state.draft=emptyDraft();state.step=0;render();toast("Leeres Formular geöffnet");}
  if(a==="backBestand"){state.draft=emptyDraft();state.step=0;go("bestand");}
  if(a==="fillDims"){const f=FORMATE.find(x=>x.k===d.formate[0]);if(f?.m){[d.technik.l,d.technik.b,d.technik.h]=f.m.map(String);["technik.l","technik.b","technik.h","masse"].forEach(k=>d.ki.delete(k));rerenderForm();updateSide();}}
  if(a==="applyIntake") applyIntake();
  if(a==="resetIntake"){intake.status="idle";intake.result=null;renderIntake();}
  if(a==="stopIntake") intake.ctl?.abort();
  if(a==="demoIntake") demoIntake();
  if(a==="mehr"){state.limit+=60;renderTable();}
  if(a==="alleZeigen"){state.limit=99999;renderTable();}
  if(a==="resetFilter"){Object.assign(state.f,{q:"",herst:"",lucke:""});state.limit=60;render();}
  if(a==="selTreffer"){gefiltert().forEach(p=>state.sel.add(p.id));renderTable();}
  if(a==="bulkClear"){state.sel.clear();renderTable();}
  if(a==="bulkApply"){
    const h=$("#bkHerst").value,fa=$("#bkFarbe").value,fo=$("#bkFormat").value,ar=$("#bkArt").value,sk=$("#bkSku").checked;
    if(!h&&!fa&&!fo&&!ar&&!sk){toast("Wähle mindestens einen Wert aus");return;}
    let n=0;state.products.forEach(p=>{if(!state.sel.has(p.id)) return;let ch=false;
      if(h&&!(p.hersteller.length===1&&p.hersteller[0]===h)){p.hersteller=[h];mark(p,"hersteller");ch=true;}
      if(ar&&!(p.herstellung.length===1&&p.herstellung[0]===ar)){p.herstellung=[ar];mark(p,"herstellung");ch=true;}
      if(fa&&!p.farben.includes(fa)){p.farben=[...p.farben,fa];mark(p,"farben");ch=true;}
      if(fo&&!p.formate.includes(fo)){p.formate=[...p.formate,fo];mark(p,"formate");ch=true;}
      if(sk&&!p.sku&&p.code&&(p.art==="verblender"||p.art==="riemchen")){p.sku=p.code+(p.art==="riemchen"?" R":"");mark(p,"sku");ch=true;}
      if(ch) n++;});
    pruefeAlle();toast(n?`${n} Einträge geändert`:"Keine Änderung nötig");render();}
  if(a==="skuAlle"){let n=0;state.products.forEach(p=>{if(!p.sku&&p.code&&(p.art==="verblender"||p.art==="riemchen")){p.sku=p.code+(p.art==="riemchen"?" R":"");mark(p,"sku");n++;}});
    pruefeAlle();toast(`${n} Artikelnummern gesetzt. Dubletten bitte vor dem Import klären.`);render();}
  if(a==="ladeDatei") $("#f-bestand").click();
  if(a==="csv") speichern(`klinkerhandel-lueckenliste-${new Date().toISOString().slice(0,10)}.csv`,csvLuecken(),"text/csv");
  if(a==="bmCopy"){const code="javascript:"+encodeURIComponent("("+sammleBestand.toString()+")()");
    try{navigator.clipboard.writeText(code).then(()=>toast("Lesezeichen-Code kopiert"),()=>toast("Kopieren nicht möglich"));}catch(err){toast("Kopieren nicht möglich");}}
  if(a==="download") speichern(`produkte-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(exportData(),null,2),"application/json");
  if(a==="copy"){const txt=JSON.stringify(exportData(),null,2);
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($("#json"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Text markiert, jetzt mit Strg+C kopieren");};
    try{navigator.clipboard.writeText(txt).then(()=>toast("JSON kopiert"),fallback);}catch(err){fallback();}}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.bind){const d=state.draft,v=t.type==="checkbox"?t.checked:t.value;setPath(d,t.dataset.bind,t.dataset.bind==="sku"?v.toUpperCase():v);
    if(d.ki.has(t.dataset.bind)){d.ki.delete(t.dataset.bind);t.classList.remove("from-ai");}
    if(t.dataset.bind==="sku"){const pos=t.selectionStart;t.value=d.sku;t.setSelectionRange(pos,pos);const ss=skuState(d);t.classList.toggle("valid",ss.ok&&!!d.sku);t.classList.toggle("invalid",!ss.ok&&!!d.sku);
      $("#skuMsg").className="msg "+ss.cls;$("#skuMsg").innerHTML=esc(ss.msg)+(ss.dup?` <button class="link-btn" data-edit="${ss.dup}">Bestehendes bearbeiten</button>`:"");}
    if(t.dataset.bind==="herstellertext"){const c=$("#textCount");if(c)c.textContent=d.herstellertext.trim().length+" Zeichen";}
    updateSide();return;}
  if(t.id==="q"){state.f.q=t.value;state.limit=60;state.open=null;renderTable();}
});
document.addEventListener("change",e=>{const t=e.target,d=state.draft;
  if(t.dataset.bind&&(t.tagName==="SELECT"||t.type==="checkbox")){setPath(d,t.dataset.bind,t.type==="checkbox"?t.checked:t.value);d.ki.delete(t.dataset.bind);updateSide();rerenderForm();}
  if(t.dataset.imgrole!==undefined){d.bilder[+t.dataset.imgrole].rolle=t.value;updateSide();}
  if(t.dataset.accept){intake.accept[t.dataset.accept]=t.checked;renderIntake();}
  if(t.dataset.sel){const id=isNaN(+t.dataset.sel)?t.dataset.sel:+t.dataset.sel;t.checked?state.sel.add(id):state.sel.delete(id);renderTable();}
  if(t.id==="selAll"){gefiltert().slice(0,state.limit).forEach(p=>t.checked?state.sel.add(p.id):state.sel.delete(p.id));renderTable();}
  if(t.id==="fHerst"){filterSet({herst:t.value,scroll:false});}
  if(t.id==="fLucke"){filterSet({lucke:t.value,scroll:false});}
  if(t.id==="fSort"){filterSet({sort:t.value,scroll:false});}
  if(t.id==="f-bestand"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);
      if(!b||!Array.isArray(b.produkte)||!Array.isArray(b.kategorien)||!b.produkte[0]||!("kategorien" in b.produkte[0])) throw new Error("Das ist keine Bestandsdatei aus dem Shop-Export.");
      const offen=state.products.filter(p=>p.aktion!=="keine").length;
      ladeBestand(b);go("bestand");toast(`${fmtN(state.products.length)} Einträge geladen${offen?`, ${offen} ungespeicherte Änderungen verworfen`:""}`);}
    catch(err){toast(err.message||"Datei nicht lesbar");}t.value="";};r.readAsText(t.files[0]);}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["bestand","erfassen","export"].includes(h)&&h!==state.view){state.view=h;render();}});
const start=location.hash.slice(1);if(["bestand","erfassen","export"].includes(start)) state.view=start;
render();
(window.claude?.use?window.claude.use("sample"):Promise.resolve(null)).then(async s=>{intake.sampler=s;if(s){const lim=await s.limits().catch(()=>null);intake.imgLimits=lim?.images||null;}
  intake.ready=true;if(state.view==="erfassen"&&intake.status==="idle") renderIntake();}).catch(()=>{intake.ready=true;if(state.view==="erfassen") renderIntake();});
</script>
