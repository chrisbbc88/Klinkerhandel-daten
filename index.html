<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Klinkerhandel ERP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2012%22%3E%3Crect%20width%3D%227.5%22%20height%3D%223.5%22%20fill%3D%22%23c8161d%22%2F%3E%3Crect%20x%3D%228.5%22%20width%3D%227.5%22%20height%3D%223.5%22%20fill%3D%22%23c8161d%22%2F%3E%3Crect%20y%3D%224.25%22%20width%3D%223.5%22%20height%3D%223.5%22%20fill%3D%22%23c8161d%22%2F%3E%3Crect%20x%3D%224.5%22%20y%3D%224.25%22%20width%3D%227%22%20height%3D%223.5%22%20fill%3D%22%23c8161d%22%2F%3E%3Crect%20x%3D%2212.5%22%20y%3D%224.25%22%20width%3D%223.5%22%20height%3D%223.5%22%20fill%3D%22%23c8161d%22%2F%3E%3Crect%20y%3D%228.5%22%20width%3D%227.5%22%20height%3D%223.5%22%20fill%3D%22%23c8161d%22%20opacity%3D%22.45%22%2F%3E%3Crect%20x%3D%228.5%22%20y%3D%228.5%22%20width%3D%227.5%22%20height%3D%223.5%22%20fill%3D%22%23c8161d%22%20opacity%3D%22.45%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{
  color-scheme:light;
  --ink:#0b1519;--ink-2:#14232a;--ink-3:#1e3039;--ink-text:#c3ccd1;--ink-faint:#7d8b92;
  --signal:#c8161d;--signal-dark:#a51117;--signal-soft:#fcefef;
  --bg:#f4f5f6;--surface:#fff;--surface-2:#f9fafb;--line:#e3e6e9;--line-strong:#cfd4d8;
  --text:#1f2731;--muted:#5f6873;--faint:#8b929a;
  --ok:#1d7148;--ok-soft:#e8f4ee;--warn:#8f5c00;--warn-soft:#fdf4e3;--bad:#b0161b;--bad-soft:#fcecec;--info:#2f5d8a;--info-soft:#eaf1f8;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;--sb:236px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
a{color:var(--signal)}
h1,h2,h3{margin:0;line-height:1.25;color:var(--ink)}
h1{font-size:20px;font-weight:600}
h2{font-size:15px;font-weight:600}
h3{font-size:13.5px;font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.klein{font-size:12px}
.nowrap{white-space:nowrap}

/* Rahmen */
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.sb{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink);color:var(--ink-text);display:flex;flex-direction:column;z-index:40}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;color:#fff;text-decoration:none;border-bottom:1px solid var(--ink-3)}
.mark{width:26px;height:18px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.5px;flex:none}
.mark i{background:var(--signal)}
.mark i:nth-child(1){grid-column:1/3}.mark i:nth-child(2){grid-column:3/5}.mark i:nth-child(3){grid-column:1/2}.mark i:nth-child(4){grid-column:2/4}.mark i:nth-child(5){grid-column:4/5}.mark i:nth-child(6){grid-column:1/3;opacity:.45}.mark i:nth-child(7){grid-column:3/5;opacity:.45}
.sb-brand b{display:block;font-size:14px;font-weight:600;line-height:1.15}
.sb-brand span{font-size:11px;color:var(--ink-faint)}
.sb nav{padding:10px 10px 16px;flex:1}
.sb-grp{margin-top:6px}
.sb-a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;color:var(--ink-text);text-decoration:none;font-weight:500;position:relative}
.sb-a:hover{background:var(--ink-2);color:#fff}
.sb-a.aktiv{background:var(--ink-3);color:#fff}
.sb-a.aktiv::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;background:var(--signal);border-radius:0 2px 2px 0}
.sb-a svg{width:17px;height:17px;flex:none;opacity:.85}
.sb-a .zahl{margin-left:auto;font-size:11px;background:var(--ink-3);color:var(--ink-text);padding:0 6px;border-radius:9px;line-height:18px}
.sb-a .zahl.rot{background:var(--signal);color:#fff}
.sb-kopf{display:flex;align-items:center;gap:2px}.sb-kopf .sb-a{flex:1}
.sb-pfeil{border:0;background:none;color:var(--ink-faint);width:26px;height:30px;border-radius:5px;cursor:pointer;display:grid;place-items:center;flex:none}
.sb-pfeil:hover{background:var(--ink-2);color:#fff}.sb-pfeil svg{transition:transform .15s}.sb-pfeil.auf svg{transform:rotate(90deg)}
.sb-sub{margin:2px 0 6px 27px;border-left:1px solid var(--ink-3);padding-left:6px}
.sb-sub .sb-a{font-weight:400;padding:5px 10px;font-size:13px}
.sb-sub .sb-a.aktiv::before{left:-7px}
.sb-fuss{padding:12px 14px;border-top:1px solid var(--ink-3);font-size:12px;display:grid;gap:8px}
.sb-fuss button{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink-text);display:flex;gap:8px;align-items:center}
.sb-fuss button:hover{color:#fff}
.punkt{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-faint)}
.punkt.ok{background:#3fae74}.punkt.warn{background:#e0a531}.punkt.bad{background:#e5484d}

.haupt{min-width:0;display:flex;flex-direction:column}
.kopf{position:sticky;top:0;z-index:30;background:rgba(244,245,246,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:56px}
.kopf .burger{display:none}
.suche-knopf{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;color:var(--faint);cursor:pointer}
.suche-knopf kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.inhalt{padding:20px 24px 48px;max-width:1500px;width:100%}
.seitenkopf{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.seitenkopf p{margin:4px 0 0;color:var(--muted)}
.seitenkopf .aktionen{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Bausteine */
.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.karte-kopf{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.karte-kopf .rechts{margin-left:auto;display:flex;gap:8px;align-items:center}
.karte-inhalt{padding:14px 16px}
.raster{display:grid;gap:16px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}.r3{grid-template-columns:repeat(3,minmax(0,1fr))}.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--ink);}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primaer{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.primaer:hover{background:var(--signal-dark)}
.btn.dunkel{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.gefahr{color:var(--bad);border-color:#e7b4b6}
.btn.gefahr:hover{background:var(--bad-soft)}
.btn.klein{padding:3px 8px;font-size:12.5px}
.btn.link{border:0;background:none;padding:0;color:var(--signal)}
.btn svg{width:15px;height:15px}
.knopfreihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.feld{display:grid;gap:4px;align-content:start}
.feld>span{font-size:12px;font-weight:500;color:var(--muted)}
.feld small{color:var(--faint);font-size:11.5px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=search],select,textarea{border:1px solid var(--line-strong);border-radius:5px;padding:6px 9px;background:var(--surface);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(11,21,25,.08)}
input.fehler,select.fehler{border-color:var(--bad);background:var(--bad-soft)}
.formular{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.formular .breit{grid-column:1/-1}
.formular .halb{grid-column:span 2}
.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:14px;padding:2px 10px;background:var(--surface);cursor:pointer;font-size:12.5px;user-select:none}
.chip.an{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.an .farbpunkt{box-shadow:0 0 0 1.5px #fff}
.farbpunkt{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.marke{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.marke.ok{background:var(--ok-soft);border-color:#c5e3d2;color:var(--ok)}
.marke.warn{background:var(--warn-soft);border-color:#f0dcb4;color:var(--warn)}
.marke.bad{background:var(--bad-soft);border-color:#efc3c5;color:var(--bad)}
.marke.info{background:var(--info-soft);border-color:#c6d7e8;color:var(--info)}
.marke.dunkel{background:var(--ink);border-color:var(--ink);color:#fff}
.hinweisbox{border:1px solid var(--line);border-left:3px solid var(--info);background:var(--info-soft);padding:10px 14px;border-radius:var(--r);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hinweisbox.warn{border-left-color:#d39a2c;background:var(--warn-soft)}
.hinweisbox.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.hinweisbox.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.hinweisbox .knopfreihe{margin-left:auto}
.banner{margin:0 24px;margin-top:12px}
.leer{padding:36px 16px;text-align:center;color:var(--muted)}
.leer b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* Tabellen */
.tabelle-wrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th.sort{cursor:pointer;user-select:none}
.t th.sort:hover{color:var(--ink)}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.klickbar{cursor:pointer}
.t tr.klickbar:hover td{background:#fafbfc}
.t tr.gewaehlt td{background:#fff7f7}
.t tr:last-child td{border-bottom:0}
.t input[type=checkbox]{width:15px;height:15px;accent-color:var(--signal)}
.t .bild{width:40px;height:40px;border-radius:4px;object-fit:cover;background:var(--surface-2);display:block}
.t input[type=number],.t input[type=text]{padding:3px 6px}
.filterleiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.filterleiste input[type=search]{width:240px}
.filterleiste select{width:auto}
.seiten{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.sammel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--ink);color:#fff}
.sammel select{width:auto;color:var(--text)}
.sammel .btn{border-color:#3a4c55;background:var(--ink-2);color:#fff}
.score{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:12px}
.score i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.score i b{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.score.mittel i b{background:#d39a2c}.score.schlecht i b{background:var(--bad)}

/* Dashboard */
.kpi{padding:14px 16px;display:grid;gap:2px}
.kpi .wert{font-size:26px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .titel{font-size:12px;color:var(--muted);font-weight:500}
.kpi .unter{font-size:12px;color:var(--faint)}
.kpi a{text-decoration:none;color:inherit}
.balken{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);gap:1.5px}
.balken span{display:block;height:100%}
.leiste{display:grid;grid-template-columns:minmax(150px,230px) 1fr 48px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.leiste .spur{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.leiste .spur b{display:block;height:100%;background:var(--ink)}
.leiste.klickbar{cursor:pointer;border-radius:4px}
.leiste.klickbar:hover{background:var(--surface-2)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 16px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.feed li:last-child{border-bottom:0}
.wer{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:600}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legende span{display:inline-flex;gap:5px;align-items:center}
.legende i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* Detail */
.reiter{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.reiter button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.reiter button:hover{color:var(--ink)}
.reiter button.an{color:var(--ink);border-bottom-color:var(--signal)}
.reiter .zahl{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-left:4px}
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.galerie figure{margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.galerie img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.galerie figcaption{padding:6px;display:grid;gap:4px}
.galerie figcaption input{font-size:12px;padding:3px 6px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.speicherleiste{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;margin:16px -16px -14px;border-radius:0 0 var(--r) var(--r)}
.speicherleiste .rechts{margin-left:auto;display:flex;gap:8px}
.diff-alt{color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(176,22,27,.4)}
.diff-neu{color:var(--ok);font-weight:500}
.pdf-seiten{display:grid;gap:10px;max-height:72vh;overflow:auto;background:#525659;padding:10px;border-radius:var(--r)}
.pdf-seiten canvas,.pdf-seiten img{width:100%;height:auto;background:#fff;display:block}

/* Dialoge */
.schleier{position:fixed;inset:0;background:rgba(11,21,25,.45);z-index:80;display:grid;place-items:start center;padding:6vh 16px;overflow:auto}
.dialog{background:var(--surface);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(640px,100%);display:flex;flex-direction:column;max-height:88vh}
.dialog.breit{width:min(1100px,100%)}
.dialog-kopf{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dialog-kopf .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.dialog-inhalt{padding:16px 18px;overflow:auto}
.dialog-fuss{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dialog-fuss .links{margin-right:auto}
.meldungen{position:fixed;right:16px;bottom:36px;z-index:90;display:grid;gap:8px;max-width:420px}
.meldung{background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13px;border-left:3px solid #3fae74}
.meldung.fehler{border-left-color:#e5484d}
.meldung.info{border-left-color:#7aa7d6}
.palette{width:min(620px,100%)}
.palette input{border:0;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;padding:14px 18px;font-size:15px}
.palette input:focus{box-shadow:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:60vh;overflow:auto}
.palette li{padding:7px 12px;border-radius:5px;cursor:pointer;display:flex;gap:10px;align-items:center}
.palette li.an{background:var(--surface-2);outline:1px solid var(--line)}
.palette li .typ{margin-left:auto;font-size:11px;color:var(--faint)}

/* Angebot drucken */
.druck{display:none}
.angebot-blatt{background:#fff;color:#111;padding:40px 48px;font-size:12.5px;max-width:820px;margin:0 auto;border:1px solid var(--line)}
.angebot-blatt h1{font-size:22px;margin:24px 0 4px}
.angebot-blatt table{width:100%;border-collapse:collapse;margin-top:16px}
.angebot-blatt th,.angebot-blatt td{padding:6px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
.angebot-blatt .summe td{border:0;padding:3px 6px}
.angebot-blatt .kopfzeile{display:flex;justify-content:space-between;gap:24px;border-bottom:3px solid var(--signal);padding-bottom:12px}

.versionsmarke{position:fixed;right:10px;bottom:8px;z-index:85;font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:4px;padding:1px 7px;text-decoration:none}
.versionsmarke:hover{color:var(--ink);border-color:var(--line-strong)}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(168px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.spalte{background:#eceef0;border-radius:8px;padding:8px;min-height:160px;border:2px solid transparent;display:grid;gap:8px;align-content:start}
.spalte.ziel{border-color:var(--signal);border-style:dashed;background:var(--signal-soft)}
.spalte header{display:flex;align-items:center;gap:6px;padding:2px 4px 4px;font-size:12.5px}
.spalte header .zahl{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.spalte header .summe{margin-left:auto;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.spalte.angenommen header b{color:var(--ok)}.spalte.abgelehnt header b{color:var(--bad)}
.pkarte{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pkarte:hover{border-color:var(--line-strong);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.pkarte .name{font-weight:500;margin-top:2px;line-height:1.35}
.pkarte[draggable=true]{cursor:grab}

@media (max-width:860px){

  .sb.offen{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}

  .suche-knopf{min-width:0}.suche-knopf kbd{display:none}
  .inhalt{padding:16px}
  .banner{margin:12px 16px 0}
  .r2,.r3{grid-template-columns:1fr}
  .filterleiste input[type=search]{width:100%}
  .formular .halb{grid-column:auto}
}
@media print{
  body{background:#fff}
  .sb,.kopf,.nicht-drucken,.meldungen,.banner,.versionsmarke{display:none!important}
  .app{display:block}.inhalt{padding:0;max-width:none}
  .angebot-blatt{border:0;padding:0;max-width:none}
}
.raster>section.karte{align-self:start}
.pruefliste{margin:0;padding:0;list-style:none;display:grid;gap:6px}.pruefliste li{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:baseline}.pruefliste .marke{justify-content:center}
